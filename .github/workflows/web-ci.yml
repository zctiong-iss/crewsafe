name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also deploy the validated build to staging (main only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  deploy-staging:
    name: Deploy staging web
    needs: build-test
    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      WEB_BUCKET: ${{ vars.CREWSAFE_WEB_BUCKET_NAME }}
      WEB_SYNC_ROLE_ARN: ${{ vars.CREWSAFE_WEB_SYNC_ROLE_ARN }}
      WEB_DISTRIBUTION_ID: ${{ vars.CREWSAFE_WEB_DISTRIBUTION_ID }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
      - name: Validate web deployment contract
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$WEB_BUCKET" && -n "$WEB_DISTRIBUTION_ID" ]] || exit 1
          [[ "$WEB_SYNC_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/crewsafe-shared-dev-web-sync$ ]] || exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.WEB_SYNC_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: CrewSafeWebDeploy-${{ github.run_id }}
          mask-aws-account-id: true
      - run: aws s3 sync dist "s3://${WEB_BUCKET}" --delete
        working-directory: web
      - id: invalidate
        run: echo "invalidation_id=$(aws cloudfront create-invalidation --distribution-id "$WEB_DISTRIBUTION_ID" --paths '/*' --query 'Invalidation.Id' --output text)" >> "$GITHUB_OUTPUT"
      - run: |
          {
            echo '## Web staging deployment'
            echo "- Commit SHA: \`${GITHUB_SHA}\`"
            echo "- Bucket: \`${WEB_BUCKET}\`"
            echo "- Invalidation ID: \`${{ steps.invalidate.outputs.invalidation_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
