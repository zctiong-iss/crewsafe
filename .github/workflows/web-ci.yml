name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also deploy the validated build to staging (main only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      WEB_BASE_URL: ${{ vars.CREWSAFE_WEB_BASE_URL }}
      # Vite bakes these public browser settings into the static bundle. Keep
      # this contract aligned with web-sync.yml: authConfig.ts throws before
      # React renders if any required value is missing.
      VITE_COGNITO_AUTHORITY: ${{ fromJSON(vars.CREWSAFE_SHARED_COGNITO_JSON).accounts.dev.issuer_uri }}
      VITE_COGNITO_CLIENT_ID: ${{ fromJSON(vars.CREWSAFE_SHARED_COGNITO_JSON).accounts.dev.web_client_id }}
      VITE_COGNITO_HOSTED_UI_DOMAIN: ${{ fromJSON(vars.CREWSAFE_SHARED_COGNITO_JSON).accounts.dev.hosted_ui_url }}
      VITE_REDIRECT_URI: ${{ vars.CREWSAFE_WEB_BASE_URL }}/callback
      VITE_POST_LOGOUT_REDIRECT_URI: ${{ vars.CREWSAFE_WEB_BASE_URL }}/
      VITE_API_BASE_URL: ${{ vars.CREWSAFE_BACKEND_BASE_URL }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate web build configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WEB_BASE_URL" =~ ^https://[a-z0-9]+\.cloudfront\.net$ ]] || { echo "Missing or malformed CREWSAFE_WEB_BASE_URL" >&2; exit 1; }
          [[ -n "$VITE_COGNITO_AUTHORITY" ]] || { echo "Missing issuer_uri in CREWSAFE_SHARED_COGNITO_JSON" >&2; exit 1; }
          [[ -n "$VITE_COGNITO_CLIENT_ID" ]] || { echo "Missing web_client_id in CREWSAFE_SHARED_COGNITO_JSON" >&2; exit 1; }
          [[ -n "$VITE_COGNITO_HOSTED_UI_DOMAIN" ]] || { echo "Missing hosted_ui_url in CREWSAFE_SHARED_COGNITO_JSON" >&2; exit 1; }
          [[ "$VITE_REDIRECT_URI" == "$WEB_BASE_URL/callback" ]] || { echo "Unexpected VITE_REDIRECT_URI" >&2; exit 1; }
          [[ "$VITE_POST_LOGOUT_REDIRECT_URI" == "$WEB_BASE_URL/" ]] || { echo "Unexpected VITE_POST_LOGOUT_REDIRECT_URI" >&2; exit 1; }
          [[ "$VITE_API_BASE_URL" =~ ^https://[a-z0-9]+\.cloudfront\.net$ ]] || { echo "Missing or malformed CREWSAFE_BACKEND_BASE_URL" >&2; exit 1; }
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies (whole tree, fail on moderate+)
        run: npm run audit
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  deploy-staging:
    name: Deploy staging web
    needs: build-test
    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      deployed_revision: ${{ steps.record-revision.outputs.deployed_revision }}
    env:
      AWS_REGION: ap-southeast-1
      WEB_BUCKET: ${{ vars.CREWSAFE_WEB_BUCKET_NAME }}
      WEB_SYNC_ROLE_ARN: ${{ vars.CREWSAFE_WEB_SYNC_ROLE_ARN }}
      WEB_DISTRIBUTION_ID: ${{ vars.CREWSAFE_WEB_DISTRIBUTION_ID }}
      WEB_BASE_URL: ${{ vars.CREWSAFE_WEB_BASE_URL }}
      VITE_COGNITO_AUTHORITY: ${{ fromJSON(vars.CREWSAFE_SHARED_COGNITO_JSON).accounts.dev.issuer_uri }}
      VITE_COGNITO_CLIENT_ID: ${{ fromJSON(vars.CREWSAFE_SHARED_COGNITO_JSON).accounts.dev.web_client_id }}
      VITE_COGNITO_HOSTED_UI_DOMAIN: ${{ fromJSON(vars.CREWSAFE_SHARED_COGNITO_JSON).accounts.dev.hosted_ui_url }}
      VITE_REDIRECT_URI: ${{ vars.CREWSAFE_WEB_BASE_URL }}/callback
      VITE_POST_LOGOUT_REDIRECT_URI: ${{ vars.CREWSAFE_WEB_BASE_URL }}/
      VITE_API_BASE_URL: ${{ vars.CREWSAFE_BACKEND_BASE_URL }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
      - name: Validate web build configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$WEB_BUCKET" && -n "$WEB_DISTRIBUTION_ID" ]] || exit 1
          [[ "$WEB_SYNC_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/crewsafe-shared-dev-web-sync$ ]] || exit 1
          [[ "$WEB_BASE_URL" =~ ^https://[a-z0-9]+\.cloudfront\.net$ ]] || { echo "Missing or malformed CREWSAFE_WEB_BASE_URL" >&2; exit 1; }
          [[ -n "$VITE_COGNITO_AUTHORITY" ]] || { echo "Missing issuer_uri in CREWSAFE_SHARED_COGNITO_JSON" >&2; exit 1; }
          [[ -n "$VITE_COGNITO_CLIENT_ID" ]] || { echo "Missing web_client_id in CREWSAFE_SHARED_COGNITO_JSON" >&2; exit 1; }
          [[ -n "$VITE_COGNITO_HOSTED_UI_DOMAIN" ]] || { echo "Missing hosted_ui_url in CREWSAFE_SHARED_COGNITO_JSON" >&2; exit 1; }
          [[ "$VITE_REDIRECT_URI" == "$WEB_BASE_URL/callback" ]] || { echo "Unexpected VITE_REDIRECT_URI" >&2; exit 1; }
          [[ "$VITE_POST_LOGOUT_REDIRECT_URI" == "$WEB_BASE_URL/" ]] || { echo "Unexpected VITE_POST_LOGOUT_REDIRECT_URI" >&2; exit 1; }
          [[ "$VITE_API_BASE_URL" =~ ^https://[a-z0-9]+\.cloudfront\.net$ ]] || { echo "Missing or malformed CREWSAFE_BACKEND_BASE_URL" >&2; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts && npm run build
        working-directory: web
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.WEB_SYNC_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: CrewSafeWebDeploy-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Verify bundle-to-edge security contract
        working-directory: web
        run: ./scripts/verify-edge-contract.sh
      - name: Sync hashed assets and SPA shell to S3
        working-directory: web
        run: ./scripts/sync-static-site.sh
      - id: invalidate
        run: echo "invalidation_id=$(aws cloudfront create-invalidation --distribution-id "$WEB_DISTRIBUTION_ID" --paths '/*' --query 'Invalidation.Id' --output text)" >> "$GITHUB_OUTPUT"
      - name: Record deployed revision
        id: record-revision
        run: |
          echo "deployed_revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          {
            echo '## Web staging deployment'
            echo "- Commit SHA: \`${GITHUB_SHA}\`"
            echo "- Bucket: \`${WEB_BUCKET}\`"
            echo "- Invalidation ID: \`${{ steps.invalidate.outputs.invalidation_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-staging:
    name: Staging smoke verification
    needs: deploy-staging
    if: always() && needs.deploy-staging.result == 'success'
    uses: ./.github/workflows/staging-smoke.yml
    permissions:
      contents: read
    with:
      trigger_component: web
      trigger_sha: ${{ needs.deploy-staging.outputs.deployed_revision }}
      web_base_url: ${{ vars.CREWSAFE_WEB_BASE_URL }}
      backend_base_url: ${{ vars.CREWSAFE_BACKEND_BASE_URL }}
      approved_web_base_url: ${{ vars.CREWSAFE_DAST_APPROVED_WEB_BASE_URL }}
      approved_backend_base_url: ${{ vars.CREWSAFE_DAST_APPROVED_BACKEND_BASE_URL }}
      smoke_site_id: ${{ vars.CREWSAFE_SMOKE_SITE_ID }}
      smoke_username: ${{ vars.CREWSAFE_SMOKE_SYNTHETIC_WORKER_USERNAME }}
      cognito_config_json: ${{ vars.CREWSAFE_SHARED_COGNITO_JSON }}
    secrets:
      SMOKE_SYNTHETIC_WORKER_PASSWORD: ${{ secrets.SMOKE_SYNTHETIC_WORKER_PASSWORD }}

  dast-staging:
    name: Authenticated staging DAST
    needs: deploy-staging
    # always() matches backend-ci.yml's dast-staging trigger: deploy-staging
    # currently has no skipped-branch ancestors here, so this is precautionary,
    # not a fix for an active bug in this file.
    if: always() && needs.deploy-staging.result == 'success'
    uses: ./.github/workflows/dast-staging.yml
    permissions:
      contents: read
    with:
      trigger_component: web
      trigger_sha: ${{ github.sha }}
      web_base_url: ${{ vars.CREWSAFE_WEB_BASE_URL }}
      backend_base_url: ${{ vars.CREWSAFE_BACKEND_BASE_URL }}
      approved_web_base_url: ${{ vars.CREWSAFE_DAST_APPROVED_WEB_BASE_URL }}
      approved_backend_base_url: ${{ vars.CREWSAFE_DAST_APPROVED_BACKEND_BASE_URL }}
      hosted_ui_url: ${{ fromJSON(vars.CREWSAFE_SHARED_COGNITO_JSON).accounts.dev.hosted_ui_url }}
      dast_username: ${{ vars.CREWSAFE_DAST_SYNTHETIC_WORKER_USERNAME }}
    secrets:
      DAST_SYNTHETIC_WORKER_PASSWORD: ${{ secrets.DAST_SYNTHETIC_WORKER_PASSWORD }}
