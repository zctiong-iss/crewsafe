name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also build and push the image to ECR (main only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  publish-image:
    name: Publish image
    needs: build-test
    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      IMAGE_REPOSITORY: ${{ vars.CREWSAFE_WEB_ECR_REPOSITORY_URL }}
      PUBLISH_ROLE_ARN: ${{ vars.CREWSAFE_WEB_ECR_PUSH_ROLE_ARN }}
      IMAGE_TAG: ${{ github.sha }}
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}
      image_tag: ${{ steps.publish.outputs.image_tag }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
      - name: Validate web publication contract
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$IMAGE_REPOSITORY" ]] || { echo "Missing CREWSAFE_WEB_ECR_REPOSITORY_URL" >&2; exit 1; }
          [[ "$IMAGE_REPOSITORY" =~ ^[0-9]{12}\.dkr\.ecr\.${AWS_REGION}\.amazonaws\.com/crewsafe/web$ ]] || { echo "Web repository must be the regional ECR crewsafe/web repository" >&2; exit 1; }
          [[ -n "$PUBLISH_ROLE_ARN" ]] || { echo "Missing CREWSAFE_WEB_ECR_PUSH_ROLE_ARN" >&2; exit 1; }
          [[ "$PUBLISH_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/crewsafe-shared-dev-ecr-web-push$ ]] || { echo "Unexpected web publisher role" >&2; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "GITHUB_SHA must be a 40-character lowercase commit SHA" >&2; exit 1; }
          printf 'Validated repository=%s tag=%s\n' "$IMAGE_REPOSITORY" "$IMAGE_TAG"
      - name: Build web image
        env:
          IMAGE_URI: ${{ vars.CREWSAFE_WEB_ECR_REPOSITORY_URL }}:${{ github.sha }}
        run: docker build --file web/Dockerfile --tag "$IMAGE_URI" web
      # SCRUM-269 (mirrored from backend-ci.yml): filters the reviewed source
      # ignorefile down to only its non-expired entries. trivyignores
      # requires a path RELATIVE TO THE REPOSITORY, so the active file is
      # written inside the checkout; it is gitignored
      # (.trivyignore-active-*) and never committed.
      - name: Prepare Trivy ignorefile
        run: |
          .github/scripts/security/filter-trivyignore.sh \
            .github/security/web-image.trivyignore.source \
            .trivyignore-active-web
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ vars.CREWSAFE_WEB_ECR_REPOSITORY_URL }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          trivyignores: .trivyignore-active-web
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.CREWSAFE_WEB_ECR_PUSH_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: CrewSafeWebPublish-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Log in to web ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$IMAGE_REPOSITORY"
      - name: Push web image and record digest
        id: publish
        env:
          IMAGE_URI: ${{ vars.CREWSAFE_WEB_ECR_REPOSITORY_URL }}:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_URI"
          image_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_URI" | sed 's/.*@//')"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No valid pushed image digest was returned" >&2; exit 1; }
          {
            echo "image_uri=$IMAGE_URI"
            echo "image_tag=$IMAGE_TAG"
            echo "image_digest=$image_digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Web image publication'
            echo "- Image URI: \`$IMAGE_URI\`"
            echo "- Commit tag: \`$IMAGE_TAG\`"
            echo "- Content digest: \`$image_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
