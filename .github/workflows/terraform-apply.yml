name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      target_account_alias: { description: "Registered AWS account alias", required: true, type: string }
      terraform_component: { description: "Catalogued Terraform component", required: true, type: string }
      operation:
        description: "Reviewed operation"
        required: true
        type: choice
        default: apply
        options: [apply, destroy]
      plan_run_id: { description: "Successful Terraform Plan run ID", required: true, type: string }
      plan_run_attempt: { description: "Successful Terraform Plan run attempt", required: true, type: string }
      confirmation: { description: "APPLY/DESTROY <alias> <component>", required: true, type: string }

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.target_account_alias }}-${{ inputs.terraform_component }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        env:
          INPUT_ACCOUNT_ALIAS: ${{ inputs.target_account_alias }}
          INPUT_COMPONENT: ${{ inputs.terraform_component }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
          INPUT_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          action=APPLY
          [[ "$INPUT_OPERATION" == destroy ]] && action=DESTROY
          expected="$action $INPUT_ACCOUNT_ALIAS $INPUT_COMPONENT"
          [[ "$INPUT_CONFIRMATION" == "$expected" ]]
          [[ "$INPUT_PLAN_RUN_ID" =~ ^[0-9]+$ && "$INPUT_PLAN_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: terraform-plan-${{ inputs.plan_run_id }}-${{ inputs.plan_run_attempt }}
          path: plan-bundle
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.plan_run_id }}
      - name: Verify source plan run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
          INPUT_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INPUT_PLAN_RUN_ID}")"
          jq -e --argjson attempt "$INPUT_PLAN_RUN_ATTEMPT" '
            .event == "workflow_dispatch" and .head_branch == "main" and
            .conclusion == "success" and .run_attempt == $attempt and
            (.path == ".github/workflows/terraform-plan.yml" or
             (.path | startswith(".github/workflows/terraform-plan.yml@")))
          ' <<<"$run_json" >/dev/null
      - name: Check out planned commit
        run: |
          commit="$(jq -r .commit plan-bundle/metadata.json)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"
      - id: component
        env:
          INPUT_COMPONENT: ${{ inputs.terraform_component }}
          INPUT_OPERATION: ${{ inputs.operation }}
        run: .github/scripts/terraform/resolve-component.sh "$INPUT_COMPONENT" "$INPUT_OPERATION"
      - id: account
        env:
          CREWSAFE_AWS_ACCOUNTS_JSON: ${{ vars.CREWSAFE_AWS_ACCOUNTS_JSON }}
          INPUT_ACCOUNT_ALIAS: ${{ inputs.target_account_alias }}
        run: .github/scripts/terraform/resolve-terraform-account.sh "$INPUT_ACCOUNT_ALIAS"
      - id: execution
        env:
          INPUT_COMPONENT: ${{ steps.component.outputs.terraform_component }}
          INPUT_OPERATION: apply
          EXECUTION_ROLE_FAMILY: ${{ steps.component.outputs.execution_role_family }}
          NORMAL_PLAN_ROLE_ARN: ${{ steps.account.outputs.plan_role_arn }}
          NORMAL_APPLY_ROLE_ARN: ${{ steps.account.outputs.apply_role_arn }}
          IAM_POLICY_PLAN_ROLE_ARN: ${{ steps.account.outputs.iam_policy_plan_role_arn }}
          IAM_POLICY_APPLY_ROLE_ARN: ${{ steps.account.outputs.iam_policy_apply_role_arn }}
        run: .github/scripts/terraform/select-execution-role.sh "$INPUT_COMPONENT" "$INPUT_OPERATION" "$EXECUTION_ROLE_FAMILY" "$NORMAL_PLAN_ROLE_ARN" "$NORMAL_APPLY_ROLE_ARN" "$IAM_POLICY_PLAN_ROLE_ARN" "$IAM_POLICY_APPLY_ROLE_ARN"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with: { terraform_version: 1.10.5, terraform_wrapper: false }
      - name: Validate exact plan
        env:
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          INPUT_ACCOUNT_ALIAS: ${{ inputs.target_account_alias }}
          INPUT_COMPONENT: ${{ inputs.terraform_component }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
          INPUT_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          LOCK_FILE: ${{ steps.component.outputs.root }}/.terraform.lock.hcl
          REGION: ${{ steps.account.outputs.region }}
        run: |
          .github/scripts/terraform/validate-plan-metadata.sh \
            plan-bundle/metadata.json "$INPUT_ACCOUNT_ALIAS" "$INPUT_PLAN_RUN_ID" \
            plan-bundle/plan.tfplan "$LOCK_FILE" "$INPUT_COMPONENT" \
            "$INPUT_OPERATION" "$INPUT_PLAN_RUN_ATTEMPT" "$ACCOUNT_ID" "$REGION"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ steps.execution.outputs.role_arn }}
          aws-region: ${{ steps.account.outputs.region }}
          role-session-name: CrewSafeApply-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Verify account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "${{ steps.account.outputs.account_id }}"
      - name: Reject reused reviewed plan
        env:
          BUCKET: ${{ steps.account.outputs.bucket }}
          INPUT_COMPONENT: ${{ inputs.terraform_component }}
          INPUT_PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
          INPUT_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          key="crewsafe/applied-plans/${INPUT_COMPONENT}/${INPUT_PLAN_RUN_ID}-${INPUT_PLAN_RUN_ATTEMPT}.json"
          if aws s3api head-object --bucket "$BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "::error::This reviewed plan has already been applied."
            exit 1
          fi
      - name: Initialize and apply exact reviewed plan
        working-directory: ${{ steps.component.outputs.root }}
        env:
          ACCOUNT_ALIAS: ${{ inputs.target_account_alias }}
          BACKEND_STRATEGY: ${{ steps.component.outputs.backend_strategy }}
          BUCKET: ${{ steps.account.outputs.bucket }}
          COMPONENT: ${{ inputs.terraform_component }}
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          NORMAL_PLAN_ROLE_ARN: ${{ steps.account.outputs.plan_role_arn }}
          NORMAL_APPLY_ROLE_ARN: ${{ steps.account.outputs.apply_role_arn }}
          PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          REGION: ${{ steps.account.outputs.region }}
          STATE_KEY: ${{ steps.component.outputs.state_key }}
        run: |
          # Values are supplied by the step environment.
          # shellcheck disable=SC2153
          . "$GITHUB_WORKSPACE/.github/scripts/terraform/plan-init.sh" \
            "$BACKEND_STRATEGY" "$BUCKET" "$REGION" "$STATE_KEY" "$ACCOUNT_ALIAS"
          if [[ "$COMPONENT" == "iam-policy-management-shared-dev" ]]; then
            "$GITHUB_WORKSPACE/.github/scripts/terraform/preflight-iam-policy-account.sh" \
              "$PWD" "$ACCOUNT_ID" "$NORMAL_PLAN_ROLE_ARN" "$NORMAL_APPLY_ROLE_ARN"
          fi
          terraform apply -input=false -auto-approve "$GITHUB_WORKSPACE/plan-bundle/plan.tfplan"
          "$GITHUB_WORKSPACE/.github/scripts/terraform/finalize-applied-plan.sh" \
            "$BACKEND_STRATEGY" "$BUCKET" "$REGION" "$STATE_KEY" \
            "$COMPONENT" "$PLAN_RUN_ID" "$PLAN_RUN_ATTEMPT"
      - name: Verify deployed Cognito boundary
        if: inputs.terraform_component == 'cognito-shared-dev' && inputs.operation == 'apply'
        env:
          EXPECTED_OIDC_SUBJECT: ${{ vars.CREWSAFE_GITHUB_OIDC_MAIN_SUBJECT }}
        run: .github/scripts/terraform/verify-cognito-deployment.sh "${{ steps.component.outputs.root }}" "${{ steps.account.outputs.account_id }}" "${{ steps.account.outputs.region }}" "${{ steps.component.outputs.state_key }}" "$EXPECTED_OIDC_SUBJECT"
