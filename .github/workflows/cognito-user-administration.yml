name: Cognito User Administration

on:
  workflow_dispatch:
    inputs:
      target_account_alias: { description: "Registered account alias", required: true, type: string }
      operation:
        description: "Allowlisted administration operation"
        required: true
        type: choice
        options: [inspect, list-users, list-groups, enable, disable, reset-password, global-sign-out, add-to-group, remove-from-group, reconcile-synthetic, rotate-synthetic, enable-synthetic, disable-synthetic]
      cognito_sub: { description: "Immutable Cognito sub; blank for list operations", required: false, type: string }
      group: { description: "developers for human membership operations", required: false, type: string }
      synthetic_key: { description: "Synthetic key; use all only for reconcile-synthetic", required: false, type: string }
      confirmation: { description: "<operation> <alias> <sub-or-synthetic-key> for state changes", required: false, type: string }

concurrency:
  group: cognito-admin-${{ inputs.target_account_alias }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    permissions: { contents: read }
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.guard.outputs.operation }}
      subject: ${{ steps.guard.outputs.subject }}
      group: ${{ steps.guard.outputs.group }}
      synthetic_key: ${{ steps.guard.outputs.synthetic_key }}
      pool: ${{ steps.config.outputs.pool }}
      manifest_checksum: ${{ steps.synthetic.outputs.manifest_checksum }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - id: guard
        env:
          CREWSAFE_AWS_ACCOUNTS_JSON: ${{ vars.CREWSAFE_AWS_ACCOUNTS_JSON }}
          INPUT_ACCOUNT_ALIAS: ${{ inputs.target_account_alias }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_GROUP: ${{ inputs.group }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_SUBJECT: ${{ inputs.cognito_sub }}
          INPUT_SYNTHETIC_KEY: ${{ inputs.synthetic_key }}
          WORKFLOW_ACTOR: ${{ github.actor }}
        run: |
          .github/scripts/cognito/resolve-admin-operation.sh \
            "$INPUT_ACCOUNT_ALIAS" "$INPUT_OPERATION" "$INPUT_SUBJECT" \
            "$INPUT_GROUP" "$WORKFLOW_ACTOR" "$INPUT_CONFIRMATION" \
            "$INPUT_SYNTHETIC_KEY"
      - id: config
        env:
          CREWSAFE_SHARED_COGNITO_JSON: ${{ vars.CREWSAFE_SHARED_COGNITO_JSON }}
          INPUT_ACCOUNT_ALIAS: ${{ inputs.target_account_alias }}
        run: |
          pool="$(
            .github/scripts/cognito/resolve-shared-config.sh \
              "$INPUT_ACCOUNT_ALIAS" | jq -r .user_pool_id
          )"
          printf 'pool=%s\n' "$pool" >>"$GITHUB_OUTPUT"
      - id: synthetic
        env:
          CREWSAFE_AWS_ACCOUNTS_JSON: ${{ vars.CREWSAFE_AWS_ACCOUNTS_JSON }}
          CREWSAFE_SHARED_COGNITO_JSON: ${{ vars.CREWSAFE_SHARED_COGNITO_JSON }}
          INPUT_ACCOUNT_ALIAS: ${{ inputs.target_account_alias }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_SYNTHETIC_KEY: ${{ inputs.synthetic_key }}
        run: |
          case "$INPUT_OPERATION" in
            reconcile-synthetic|rotate-synthetic|enable-synthetic|disable-synthetic)
              selection="$(
                .github/scripts/cognito/resolve-synthetic-users.sh \
                  "$INPUT_ACCOUNT_ALIAS" "$INPUT_SYNTHETIC_KEY"
              )"
              printf 'manifest_checksum=%s\n' \
                "$(jq -r .manifest_checksum <<<"$selection")" >>"$GITHUB_OUTPUT"
              ;;
            *) printf 'manifest_checksum=\n' >>"$GITHUB_OUTPUT" ;;
          esac

  administer:
    needs: authorize
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - id: account
        env:
          CREWSAFE_AWS_ACCOUNTS_JSON: ${{ vars.CREWSAFE_AWS_ACCOUNTS_JSON }}
          INPUT_ACCOUNT_ALIAS: ${{ inputs.target_account_alias }}
        run: .github/scripts/terraform/resolve-terraform-account.sh "$INPUT_ACCOUNT_ALIAS"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: arn:aws:iam::${{ steps.account.outputs.account_id }}:role/CrewSafeGitHubCognitoAdminRole
          aws-region: ${{ steps.account.outputs.region }}
          role-session-name: CrewSafeCognitoAdmin-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Execute allowlisted operation
        env:
          POOL: ${{ needs.authorize.outputs.pool }}
          OPERATION: ${{ needs.authorize.outputs.operation }}
          SUBJECT: ${{ needs.authorize.outputs.subject }}
          GROUP: ${{ needs.authorize.outputs.group }}
          SYNTHETIC_KEY: ${{ needs.authorize.outputs.synthetic_key }}
          ACCOUNT_ALIAS: ${{ inputs.target_account_alias }}
          CREWSAFE_AWS_ACCOUNTS_JSON: ${{ vars.CREWSAFE_AWS_ACCOUNTS_JSON }}
          CREWSAFE_SHARED_COGNITO_JSON: ${{ vars.CREWSAFE_SHARED_COGNITO_JSON }}
          EXPECTED_MANIFEST_CHECKSUM: ${{ needs.authorize.outputs.manifest_checksum }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            reconcile-synthetic|rotate-synthetic|enable-synthetic|disable-synthetic)
              results="$(
                .github/scripts/cognito/reconcile-synthetic-users.sh \
                  "$ACCOUNT_ALIAS" "$OPERATION" "$SYNTHETIC_KEY" "$POOL"
              )"
              {
                # Markdown backticks are intentionally single-quoted.
                # shellcheck disable=SC2016
                printf 'Actor: `%s`\nAccount: `%s`\nOperation: `%s`\nRun: `%s`\n\n' \
                  "$GITHUB_ACTOR" "$ACCOUNT_ALIAS" "$OPERATION" "$GITHUB_RUN_ID"
                while IFS= read -r result; do
                  # jq interpolation is intentionally single-quoted.
                  # shellcheck disable=SC2016
                  jq -r '"Synthetic key: `\(.key)`\nSubject: `\(.cognito_sub // "unbound")`\nResult: `\(.result)`\n"' \
                    <<<"$result"
                done <<<"$results"
              } >>"$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          case "$OPERATION" in
            enable|disable|reset-password|global-sign-out|add-to-group|remove-from-group)
              .github/scripts/cognito/guard-admin-target-kind.sh \
                "$POOL" "$ACCOUNT_ALIAS" "$SUBJECT" "$OPERATION" "$GROUP" >/dev/null
              ;;
          esac

          # AWS CLI JMESPath literals require these single quotes.
          # shellcheck disable=SC2016
          case "$OPERATION" in
            inspect) aws cognito-idp list-users --user-pool-id "$POOL" --filter "sub = \"$SUBJECT\"" --attributes-to-get sub --query 'Users[].{Sub:Attributes[?Name==`sub`]|[0].Value,Enabled:Enabled,Status:UserStatus,Created:UserCreateDate}' ;;
            list-users) aws cognito-idp list-users --user-pool-id "$POOL" --attributes-to-get sub --query 'Users[].{Sub:Attributes[?Name==`sub`]|[0].Value,Enabled:Enabled,Status:UserStatus,Created:UserCreateDate}' ;;
            list-groups) aws cognito-idp list-groups --user-pool-id "$POOL" --query 'Groups[].GroupName' ;;
            enable) aws cognito-idp admin-enable-user --user-pool-id "$POOL" --username "$SUBJECT" ;;
            disable) aws cognito-idp admin-disable-user --user-pool-id "$POOL" --username "$SUBJECT" ;;
            reset-password) aws cognito-idp admin-reset-user-password --user-pool-id "$POOL" --username "$SUBJECT" ;;
            global-sign-out) aws cognito-idp admin-user-global-sign-out --user-pool-id "$POOL" --username "$SUBJECT" ;;
            add-to-group) aws cognito-idp admin-add-user-to-group --user-pool-id "$POOL" --username "$SUBJECT" --group-name "$GROUP" ;;
            remove-from-group) aws cognito-idp admin-remove-user-from-group --user-pool-id "$POOL" --username "$SUBJECT" --group-name "$GROUP" ;;
          esac
          # Markdown backticks in the summary are intentionally single quoted.
          # shellcheck disable=SC2016
          printf 'Actor: `%s`\nAccount: `%s`\nOperation: `%s`\nSubject: `%s`\nResult: `succeeded`\nRun: `%s`\n' \
            "$GITHUB_ACTOR" "$ACCOUNT_ALIAS" "$OPERATION" "${SUBJECT:-n/a}" "$GITHUB_RUN_ID" >>"$GITHUB_STEP_SUMMARY"
