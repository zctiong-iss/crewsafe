name: ML-service CI

on:
  pull_request:
    branches: [main]
    paths:
      - "ml-service/**"
      - ".github/workflows/ml-service-ci.yml"
      - ".github/scripts/ci/run-ml-service-smoke.sh"
      - ".github/scripts/deploy/deploy-ml-service-staging.sh"
      - ".github/scripts/security/validate-ml-service-trivy-exceptions.sh"
      - ".github/scripts/security/validate-trivy-exceptions.sh"
      - ".github/scripts/security/summarize-trivy-report.sh"
      - ".github/scripts/security/filter-trivyignore.sh"
      - ".github/scripts/security/resolve-trivy-policy-mode.sh"
      - ".github/scripts/tests/test-ml-service-ci-workflow.sh"
      - ".github/scripts/tests/test-ci-guards.sh"
      - ".github/scripts/tests/test-resolve-trivy-policy-mode.sh"
      - ".github/scripts/tests/test-ml-service-smoke.sh"
      - ".github/scripts/tests/test-validate-ml-service-trivy-exceptions.sh"
      - ".github/scripts/tests/test-validate-trivy-exceptions.sh"
      - ".github/scripts/tests/test-summarize-trivy-report.sh"
      - ".github/security/ml-service-image.trivyignore.source"
  push:
    branches: [main]
    paths:
      - "ml-service/**"
      - ".github/workflows/ml-service-ci.yml"
      - ".github/scripts/ci/run-ml-service-smoke.sh"
      - ".github/scripts/deploy/deploy-ml-service-staging.sh"
      - ".github/scripts/security/validate-ml-service-trivy-exceptions.sh"
      - ".github/scripts/security/validate-trivy-exceptions.sh"
      - ".github/scripts/security/summarize-trivy-report.sh"
      - ".github/scripts/security/filter-trivyignore.sh"
      - ".github/scripts/security/resolve-trivy-policy-mode.sh"
      - ".github/scripts/tests/test-ml-service-ci-workflow.sh"
      - ".github/scripts/tests/test-ci-guards.sh"
      - ".github/scripts/tests/test-resolve-trivy-policy-mode.sh"
      - ".github/scripts/tests/test-ml-service-smoke.sh"
      - ".github/scripts/tests/test-validate-ml-service-trivy-exceptions.sh"
      - ".github/scripts/tests/test-validate-trivy-exceptions.sh"
      - ".github/scripts/tests/test-summarize-trivy-report.sh"
      - ".github/security/ml-service-image.trivyignore.source"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also build and push the image to ECR (main only)"
        type: boolean
        default: false
      redeploy:
        description: "Redeploy an approved main-ancestor commit's existing immutable ml-service image without publishing"
        type: boolean
        default: false
      redeploy_image_tag:
        description: "Full approved commit SHA of an existing ml-service image that is reachable from main"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ml-service-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ml-service:
    name: Verify ML-service
    runs-on: ubuntu-latest
    env:
      IMAGE: crewsafe-ml-service:${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Run ML-service CI self-tests
        run: |
          .github/scripts/tests/test-ml-service-ci-workflow.sh
          .github/scripts/tests/test-ml-service-smoke.sh
          .github/scripts/tests/test-validate-ml-service-trivy-exceptions.sh
          .github/scripts/tests/test-validate-trivy-exceptions.sh
          .github/scripts/tests/test-resolve-trivy-policy-mode.sh
          .github/scripts/tests/test-summarize-trivy-report.sh

      - name: Install ML-service dependencies
        working-directory: ml-service
        run: python -m pip install --require-hashes -r requirements.txt

      # test_agent_eval.py is deliberately excluded: it is a live, billed Bedrock benchmark,
      # not a unit test. test_agent_graph.py is its offline counterpart and stubs the client,
      # so it needs no AWS credentials and runs in under a second (SCRUM-289).
      - name: Run ML-service tests
        working-directory: ml-service
        run: python -m pytest test_forecast.py test_bedrock_client.py test_agent_graph.py test_app_error_handling.py test_app_bind.py

      - name: Run Scrum 114 unit and data-contract tests
        working-directory: ml-service
        run: python -m pytest -q tests

      - name: Build ML-service image
        run: docker build -t "$IMAGE" ml-service

      - name: Run ML-service container smoke checks
        run: .github/scripts/ci/run-ml-service-smoke.sh "$IMAGE"

      - name: Validate ML-service Trivy exceptions
        run: .github/scripts/security/validate-trivy-exceptions.sh .github/security/ml-service-image.trivyignore.source

      - name: Prepare active ML-service Trivy ignorefile
        run: .github/scripts/security/filter-trivyignore.sh .github/security/ml-service-image.trivyignore.source .trivyignore-active-ml-service

      # SCRUM-455: the CrewSafe security team's temporary report-only policy
      # remains active through UTC 2026-09-17 and returns to blocking on
      # 2026-09-18. Valid findings remain explicit evidence; scanner, registry,
      # policy, report-integrity, and identity failures always fail closed.
      - name: Resolve ML-service Trivy policy
        id: trivy_policy
        run: .github/scripts/security/resolve-trivy-policy-mode.sh

      - name: Generate ML-service Trivy report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "${{ env.IMAGE }}"
          scanners: vuln
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore-active-ml-service
          format: json
          output: trivy-ml-service-report.json
          ignore-unfixed: false
          exit-code: ${{ steps.trivy_policy.outputs.exit_code }}

      - name: Summarize ML-service Trivy report
        if: always()
        env:
          POLICY_MODE: ${{ steps.trivy_policy.outputs.mode }}
          POLICY_OWNER: ${{ steps.trivy_policy.outputs.owner }}
          POLICY_EXPIRES: ${{ steps.trivy_policy.outputs.expires }}
          POLICY_EVALUATED_ON: ${{ steps.trivy_policy.outputs.evaluated_on }}
          EXCEPTIONS: .trivyignore-active-ml-service
        run: .github/scripts/security/summarize-trivy-report.sh trivy-ml-service-report.json "$GITHUB_STEP_SUMMARY" "$IMAGE" "${GITHUB_SHA::12}" "$POLICY_MODE" "ML-service container vulnerability scan" "$EXCEPTIONS"

      - name: Upload ML-service Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-ml-service-report
          path: trivy-ml-service-report.json
          if-no-files-found: error
          retention-days: 7

  # SCRUM-373: ml-service existed only as a CI-tested image, with no ECR
  # repository or push identity, until infra/terraform/ecr/main.tf added both.
  # This job publishes it, mirroring backend-ci.yml's publish-image job
  # (structure, gating, and the build-then-scan-then-push ordering) so the new
  # repository/role are actually used rather than provisioned and idle.
  publish-image:
    name: Publish image
    needs: verify-ml-service
    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.redeploy)
      ) &&
      vars.CREWSAFE_ML_SERVICE_ECR_PUSH_ROLE_ARN != '' && vars.CREWSAFE_ML_SERVICE_ECR_REPOSITORY_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}
      image_tag: ${{ steps.publish.outputs.image_tag }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
      run_id: ${{ steps.publish.outputs.run_id }}
      run_url: ${{ steps.publish.outputs.run_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # Fails fast on a bad repository, role, or tag before any build/scan/
      # AWS-credentialed step runs, mirroring backend-ci.yml's own
      # publication-contract validation.
      - name: Validate ml-service publication contract
        env:
          REPO: ${{ vars.CREWSAFE_ML_SERVICE_ECR_REPOSITORY_URL }}
          PUSH_ROLE_ARN: ${{ vars.CREWSAFE_ML_SERVICE_ECR_PUSH_ROLE_ARN }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$REPO" ]] || { echo "Missing CREWSAFE_ML_SERVICE_ECR_REPOSITORY_URL" >&2; exit 1; }
          [[ "$REPO" =~ ^[0-9]{12}\.dkr\.ecr\.ap-southeast-1\.amazonaws\.com/crewsafe/ml-service$ ]] || { echo "ml-service repository must be the regional ECR crewsafe/ml-service repository" >&2; exit 1; }
          [[ -n "$PUSH_ROLE_ARN" ]] || { echo "Missing CREWSAFE_ML_SERVICE_ECR_PUSH_ROLE_ARN" >&2; exit 1; }
          [[ "$PUSH_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/crewsafe-shared-dev-ecr-ml-service-push$ ]] || { echo "Unexpected ml-service publisher role" >&2; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "GITHUB_SHA must be a 40-character lowercase commit SHA" >&2; exit 1; }
          printf 'Validated repository=%s role=%s tag=%s\n' "$REPO" "$PUSH_ROLE_ARN" "$SHA"
      - name: Build ml-service image
        env:
          REPO: ${{ vars.CREWSAFE_ML_SERVICE_ECR_REPOSITORY_URL }}
          SHA: ${{ github.sha }}
        run: docker build -t "$REPO:$SHA" ml-service
      - name: Validate ml-service Trivy exceptions
        run: .github/scripts/security/validate-trivy-exceptions.sh .github/security/ml-service-image.trivyignore.source
      - name: Prepare active ML-service Trivy ignorefile
        run: .github/scripts/security/filter-trivyignore.sh .github/security/ml-service-image.trivyignore.source .trivyignore-active-ml-service
      # SCRUM-455: the CrewSafe security team's temporary report-only policy
      # remains active through UTC 2026-09-17 and returns to blocking on
      # 2026-09-18. Findings remain explicit evidence and are never reported
      # as clean; scanner, registry, policy, and evidence failures fail closed.
      - name: Resolve ML-service Trivy policy
        id: trivy_policy
        run: .github/scripts/security/resolve-trivy-policy-mode.sh

      - name: Scan ml-service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ vars.CREWSAFE_ML_SERVICE_ECR_REPOSITORY_URL }}:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-ml-service-publish-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: ${{ steps.trivy_policy.outputs.exit_code }}
          trivyignores: .trivyignore-active-ml-service
      - name: Summarize ml-service image scan
        if: always()
        env:
          IMAGE: ${{ vars.CREWSAFE_ML_SERVICE_ECR_REPOSITORY_URL }}:${{ github.sha }}
          POLICY_MODE: ${{ steps.trivy_policy.outputs.mode }}
          POLICY_OWNER: ${{ steps.trivy_policy.outputs.owner }}
          POLICY_EXPIRES: ${{ steps.trivy_policy.outputs.expires }}
          POLICY_EVALUATED_ON: ${{ steps.trivy_policy.outputs.evaluated_on }}
          EXCEPTIONS: .trivyignore-active-ml-service
        run: .github/scripts/security/summarize-trivy-report.sh trivy-ml-service-publish-report.json "$GITHUB_STEP_SUMMARY" "$IMAGE" "${GITHUB_SHA::12}" "$POLICY_MODE" "ML-service container vulnerability scan" "$EXCEPTIONS"
      - name: Upload ml-service publish Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-ml-service-publish-report
          path: trivy-ml-service-publish-report.json
          if-no-files-found: error
          retention-days: 7
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.CREWSAFE_ML_SERVICE_ECR_PUSH_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: CrewSafeMlServicePublish-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region ap-southeast-1 \
            | docker login --username AWS --password-stdin "${{ vars.CREWSAFE_ML_SERVICE_ECR_REPOSITORY_URL }}"
      # Captures the pushed image's content digest (the only truly immutable
      # reference), validates its shape, and surfaces
      # image_uri/image_tag/image_digest/run_id/run_url as both job outputs
      # and job-summary evidence, mirroring backend-ci.yml's `id: publish` step.
      - name: Push ml-service image and record digest
        id: publish
        env:
          REPO: ${{ vars.CREWSAFE_ML_SERVICE_ECR_REPOSITORY_URL }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$REPO:$SHA"
          image_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$REPO:$SHA" | sed 's/.*@//')"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No valid pushed image digest was returned" >&2; exit 1; }
          {
            echo "image_uri=$REPO:$SHA"
            echo "image_tag=$SHA"
            echo "image_digest=$image_digest"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## ml-service image publication'
            echo "- Image URI: \`$REPO:$SHA\`"
            echo "- Commit tag: \`$SHA\`"
            echo "- Content digest: \`$image_digest\`"
            echo "- CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  # SCRUM-373 follow-up: redeploys an already-published, main-ancestor
  # ml-service image without requiring a Terraform apply to bump
  # var.initial_ml_service_image_tag (research.md R-011's lesson, applied to
  # the sidecar). Mirrors backend-ci.yml's resolve-existing-image job exactly:
  # accepts a full commit SHA, proves it is reachable from the selected main
  # ref, then resolves its image using the dedicated ml-service deploy role.
  # It never builds or pushes, and must scan the resolved digest before its
  # job can feed deployment. The shared deploy-staging job also accepts the
  # successful publish-image path, so a gated main-branch publication rolls
  # out automatically using the digest captured by that job.
  resolve-existing-image:
    name: Resolve existing ml-service image
    needs: verify-ml-service
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.redeploy && !inputs.publish &&
      vars.CREWSAFE_ML_SERVICE_DEPLOY_ROLE_ARN != '' && vars.CREWSAFE_ML_SERVICE_ECR_REPOSITORY_URL != ''
    runs-on: ubuntu-latest
    env:
      REPO: ${{ vars.CREWSAFE_ML_SERVICE_ECR_REPOSITORY_URL }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      image_digest: ${{ steps.resolve.outputs.image_digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Validate existing-image redeploy contract
        env:
          REPO: ${{ vars.CREWSAFE_ML_SERVICE_ECR_REPOSITORY_URL }}
          DEPLOY_ROLE_ARN: ${{ vars.CREWSAFE_ML_SERVICE_DEPLOY_ROLE_ARN }}
          IMAGE_TAG: ${{ inputs.redeploy_image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPO" =~ ^[0-9]{12}\.dkr\.ecr\.ap-southeast-1\.amazonaws\.com/crewsafe/ml-service$ ]] || { echo "ml-service repository must be the regional ECR crewsafe/ml-service repository" >&2; exit 1; }
          [[ "$DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/crewsafe-shared-dev-ml-service-deploy$ ]] || { echo "Unexpected ml-service deployment role" >&2; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "redeploy_image_tag must be a 40-character lowercase commit SHA" >&2; exit 1; }
          git cat-file -e "$IMAGE_TAG^{commit}" || { echo "redeploy_image_tag is not a repository commit" >&2; exit 1; }
          git merge-base --is-ancestor "$IMAGE_TAG" "$GITHUB_SHA" || { echo "redeploy_image_tag is not reachable from selected main" >&2; exit 1; }
      - name: Validate ml-service Trivy exceptions for redeploy
        run: .github/scripts/security/validate-trivy-exceptions.sh .github/security/ml-service-image.trivyignore.source
      - name: Prepare active ml-service Trivy ignorefile for redeploy
        run: .github/scripts/security/filter-trivyignore.sh .github/security/ml-service-image.trivyignore.source .trivyignore-active-ml-service
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.CREWSAFE_ML_SERVICE_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: CrewSafeMlServiceRedeploy-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Resolve selected main image digest
        id: resolve
        env:
          IMAGE_TAG: ${{ inputs.redeploy_image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          image_digest="$(aws ecr describe-images --repository-name crewsafe/ml-service --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No immutable digest exists for approved commit" >&2; exit 1; }
          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_digest=$image_digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Existing ml-service image resolved'
            echo "- Approved commit tag: \`$IMAGE_TAG\`"
            echo "- Content digest: \`$image_digest\`"
            echo '- Result: resolved candidate pending vulnerability gate'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve ML-service Trivy policy
        id: trivy_policy
        run: .github/scripts/security/resolve-trivy-policy-mode.sh
      - name: Log in to ECR for ml-service redeploy scan
        run: |
          aws ecr get-login-password --region ap-southeast-1 \
            | docker login --username AWS --password-stdin "${{ vars.CREWSAFE_ML_SERVICE_ECR_REPOSITORY_URL }}"
      - name: Scan existing ml-service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "${{ env.REPO }}@${{ steps.resolve.outputs.image_digest }}"
          scanners: vuln
          format: json
          output: trivy-ml-service-redeploy-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: ${{ steps.trivy_policy.outputs.exit_code }}
          trivyignores: .trivyignore-active-ml-service
      - name: Summarize existing ml-service image scan
        if: always()
        env:
          IMAGE: "${{ env.REPO }}@${{ steps.resolve.outputs.image_digest }}"
          IMAGE_TAG: "${{ inputs.redeploy_image_tag }}"
          POLICY_MODE: ${{ steps.trivy_policy.outputs.mode }}
          POLICY_OWNER: ${{ steps.trivy_policy.outputs.owner }}
          POLICY_EXPIRES: ${{ steps.trivy_policy.outputs.expires }}
          POLICY_EVALUATED_ON: ${{ steps.trivy_policy.outputs.evaluated_on }}
          EXCEPTIONS: .trivyignore-active-ml-service
        run: .github/scripts/security/summarize-trivy-report.sh trivy-ml-service-redeploy-report.json "$GITHUB_STEP_SUMMARY" "$IMAGE" "$IMAGE_TAG" "$POLICY_MODE" "ML-service container vulnerability scan" "$EXCEPTIONS"
      - name: Upload existing ml-service Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-ml-service-redeploy-report
          path: trivy-ml-service-redeploy-report.json
          if-no-files-found: error
          retention-days: 7

  deploy-staging:
    name: Deploy staging ml-service
    needs: [publish-image, resolve-existing-image]
    if: >
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.publish-image.result == 'success' || needs.resolve-existing-image.result == 'success') &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && ((inputs.publish && !inputs.redeploy) || (inputs.redeploy && !inputs.publish)))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REPOSITORY: ${{ vars.CREWSAFE_ML_SERVICE_ECR_REPOSITORY_URL }}
      IMAGE_TAG: ${{ needs.publish-image.outputs.image_tag || needs.resolve-existing-image.outputs.image_tag }}
      IMAGE_DIGEST: ${{ needs.publish-image.outputs.image_digest || needs.resolve-existing-image.outputs.image_digest }}
      CLUSTER: ${{ vars.CREWSAFE_BACKEND_ECS_CLUSTER_NAME }}
      SERVICE: ${{ vars.CREWSAFE_BACKEND_ECS_SERVICE_NAME }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate ml-service deployment contract
        env:
          DEPLOY_ROLE_ARN: ${{ vars.CREWSAFE_ML_SERVICE_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/crewsafe-shared-dev-ml-service-deploy$ ]]
          [[ "$CLUSTER" == crewsafe-shared-dev && "$SERVICE" == backend ]]
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.CREWSAFE_ML_SERVICE_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: CrewSafeMlServiceDeploy-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Deploy immutable ml-service release
        id: deploy
        run: .github/scripts/deploy/deploy-ml-service-staging.sh
