name: Security Scan

# SCRUM-178. Deliberately NOT path-filtered: a secret can be committed anywhere,
# and the existing gitleaks step lives inside the path-filtered Terraform
# workflow, so a backend-only pull request currently gets no secret scan at all.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Also the ONLY thing that refreshes SonarQube's own "main" branch
    # snapshot (the Code/dashboard view, distinct from PR-scoped analysis).
    # Removed briefly on 2026-08-07 to save SAST's analysis quota on merge
    # commits, then restored the same day: with no push trigger, main's
    # snapshot never updates at all (SAST already excludes schedule below,
    # by design), and it was discovered stuck on a stale, wrong-scope
    # analysis from before the sonar-maven-plugin -> scan-action fix. See
    # docs/plans/SCRUM-178-sast-and-secret-scanning-plan.md.
  schedule:
    # Daily full-history sweep (FR-002a), midnight Singapore time (UTC+8).
    # cron: is always UTC on GitHub Actions, so 00:00 SGT is 16:00 UTC the
    # preceding day. GitHub disables scheduled workflows after 60 days of
    # repository inactivity -- a quiet period is not a clean sweep. See
    # docs/runbooks/SCRUM-178-sast-and-secret-scanning.md.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Full history: required for merge-base resolution on pull requests
          # and for the full-history sweep on push, schedule, and
          # workflow_dispatch.
          fetch-depth: 0

      - name: Install scanners
        run: .github/scripts/security/install-scanners.sh

      # github context values reach the shell only through env vars, never
      # through ${{ }} interpolation inside run:. A branch name is
      # attacker-influenced text; interpolating it directly would let it be
      # parsed as shell (SEC-002).
      - name: Scan for secrets
        id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          if [ "$EVENT_NAME" = "pull_request" ]; then
            .github/scripts/security/scan-secrets.sh \
              --mode range \
              --base "origin/${BASE_REF}" \
              --out "${RUNNER_TEMP}/secret-findings.json"
          else
            .github/scripts/security/scan-secrets.sh \
              --mode full \
              --out "${RUNNER_TEMP}/secret-findings.json"
          fi
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "scope=pull request commit range" >> "$GITHUB_OUTPUT"
          else
            echo "scope=full repository history" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Report findings
        if: always()
        env:
          SCAN_SCOPE: ${{ steps.scan.outputs.scope }}
          SCAN_STATUS: ${{ steps.scan.outputs.status }}
        run: |
          .github/scripts/security/report-findings.sh \
            --in "${RUNNER_TEMP}/secret-findings.json" \
            --tool gitleaks \
            --scope "${SCAN_SCOPE}" \
            --status "${SCAN_STATUS:-2}"

      # Fail closed. Exit 1 (findings) and exit 2 (scanner could not run) both
      # fail the check; the summary above says which. A green check must never
      # mean "the scanner did not run".
      - name: Enforce gate
        if: always()
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.status }}
        run: |
          case "${SCAN_STATUS:-2}" in
            0) echo "Secret scan passed." ;;
            1) echo "::error::Secret scan found blocking findings. See the job summary."; exit 1 ;;
            *) echo "::error::Secret scan could not run (infrastructure failure). See the job summary."; exit 1 ;;
          esac

  sast:
    name: SAST (SonarQube)
    runs-on: ubuntu-latest
    # A scheduled run adds nothing for SAST -- it analyses the current tree, not
    # history -- and would consume free-plan quota for no signal. The secret
    # sweep is the point of the scheduled run. SAST still runs on push, though:
    # that is what keeps SonarQube's own "main" branch snapshot (the
    # Code/dashboard view) current, distinct from each PR's own analysis.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Sonar uses git history to attribute lines and to compute the "new
          # code" period the Quality Gate is scored against. A shallow clone
          # silently degrades new-code detection without failing.
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Absent SONAR_TOKEN must FAIL, never skip. It is absent on fork pull
      # requests, and a skipped security gate that reports green is worse than
      # one that is visibly missing (FR-008a).
      #
      # pull_request_target is deliberately NOT used to make secrets available
      # to forks: it runs with full secret access while checking out untrusted
      # head code.
      - name: Verify analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error::SONAR_TOKEN is not available, so SAST could not run."
            echo "::error::This gate fails closed. Fork pull requests cannot run SAST; open the branch in this repository instead."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            web/package-lock.json

      - name: Install web dependencies for analysis
        working-directory: web
        run: npm ci

      - name: Install mobile dependencies for coverage
        working-directory: mobile
        run: npm ci

      - name: Generate mobile coverage
        working-directory: mobile
        run: npm run test:coverage

      - name: Prepare mobile LCOV for SonarQube
        shell: bash
        run: |
          test -s mobile/coverage/lcov.info
          awk -v prefix="mobile/" '
            /^SF:/ {
              path = substr($0, 4)
              sub(/^\.\//, "", path)
              if (path !~ /^\// && index(path, prefix) != 1) {
                $0 = "SF:" prefix path
              }
            }
            { print }
          ' mobile/coverage/lcov.info > mobile/coverage/sonar-lcov.info
          test -s mobile/coverage/sonar-lcov.info
          grep -q '^SF:mobile/src/' mobile/coverage/sonar-lcov.info

      # Runs tests (not just compile) for two reasons: the Java analyzer needs
      # compiled main and test classes (sonar.java.binaries/test.binaries), and
      # jacoco-maven-plugin's report execution -- bound to the test phase --
      # is what produces the coverage XML the Quality Gate's "Coverage on New
      # Code" condition reads (sonar.coverage.jacoco.xmlReportPaths). This
      # duplicates backend-ci.yml's test run; accepted so the gate reflects
      # real coverage instead of a hardcoded 0%.
      - name: Compile and test backend (bytecode + coverage for SonarQube)
        working-directory: backend
        run: ./mvnw -B test

      - name: Prepare backend dependencies for SonarQube
        working-directory: backend
        run: |
          ./mvnw -B -DskipTests \
            -DincludeScope=runtime \
            -DoutputDirectory=target/dependency \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies
          ./mvnw -B -DskipTests \
            -DincludeScope=test \
            -DoutputDirectory=target/test-dependency \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies
          test -n "$(find target/dependency -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -n "$(find target/test-dependency -maxdepth 1 -type f -name '*.jar' -print -quit)"

      # SCRUM-178, 2026-08-06: this used to run via sonar-maven-plugin bound to
      # backend/pom.xml. That silently under-scanned the repo -- the Sonar
      # Maven plugin resolves sonar.sources relative to the invoked module's
      # own basedir and is documented to skip paths outside it even when
      # sonar.projectBaseDir is set (a known upstream limitation for
      # non-multi-module Maven projects, not something our config could work
      # around). web/ and mobile/ were being silently dropped.
      #
      # The official scanner action has no such module-scoping concept: it
      # reads sonar-project.properties natively from the repo root (its
      # projectBaseDir default is ".", i.e. wherever the step runs, which is
      # the checkout root) and analyses exactly the sources declared there --
      # backend/, web/, and mobile/ alike. No manual property-loading or path
      # rewriting needed; that hand-rolled bash block is gone.
      - name: Analyse with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # sonar.qualitygate.wait=true is what makes this a gate at all.
          # Without it the step exits 0 regardless of the Quality Gate result
          # -- the single most likely way to ship a SAST gate that never gates.
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  sonar-securityhub-import:
    name: Sonar Security Hub Import
    needs: sast
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check reviewed activation
        id: activation
        run: |
          enabled="$(jq -r '.enabled' .github/securityhub-import.json)"
          if [[ "$enabled" == true ]]; then
            printf 'enabled=true\n' >>"$GITHUB_OUTPUT"
          else
            printf 'enabled=false\n' >>"$GITHUB_OUTPUT"
            printf 'NOT-ACTIVATED\n' >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify importer role configuration
        if: steps.activation.outputs.enabled == 'true'
        env:
          IMPORT_ROLE_ARN: ${{ vars.CREWSAFE_SONAR_SECURITYHUB_IMPORT_ROLE_ARN }}
        run: |
          if [ -z "${IMPORT_ROLE_ARN}" ]; then
            echo "::error::CREWSAFE_SONAR_SECURITYHUB_IMPORT_ROLE_ARN is not configured."
            echo "::error::Set it to the reviewed Terraform output sonar_securityhub_import_role_arn before activating this importer."
            exit 1
          fi

      - name: Configure importer identity
        if: steps.activation.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.CREWSAFE_SONAR_SECURITYHUB_IMPORT_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: CrewSafeSonarSecurityHub-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Import selected redacted findings
        if: steps.activation.outputs.enabled == 'true'
        env:
          SONAR_SECURITYHUB_TOKEN: ${{ secrets.SONAR_SECURITYHUB_TOKEN }}
          CREWSAFE_SECURITYHUB_ACCOUNT_ID: ${{ vars.CREWSAFE_SECURITYHUB_ACCOUNT_ID }}
          AWS_REGION: ap-southeast-1
        run: .github/scripts/security/import-sonar-securityhub.sh

  gate-tests:
    name: Gate Self-Tests
    runs-on: ubuntu-latest
    # Runs the gates' own tests in the pipeline, so a change that silently
    # disables or downgrades a gate fails a test rather than passing unnoticed.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install scanners
        run: .github/scripts/security/install-scanners.sh

      - name: Secret gate self-tests
        run: .github/scripts/tests/test-secret-scan-gate.sh

      - name: Reporter self-tests
        run: .github/scripts/tests/test-report-findings.sh

      - name: SAST gate configuration lint
        run: .github/scripts/tests/test-sast-gate-config.sh

      - name: Sonar Security Hub importer self-tests
        run: .github/scripts/tests/test-sonar-securityhub-import.sh

      - name: Sonar Quality Gate configurator self-tests
        run: .github/scripts/tests/test-sonar-gate-configure.sh
