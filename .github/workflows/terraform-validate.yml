name: Terraform Validation

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/cognito/**"
      - ".github/scripts/cognito/**"
      - ".github/terraform/**"
      - ".github/scripts/terraform/**"
      - ".github/workflows/cognito-user-administration.yml"
      - ".github/workflows/terraform-validate.yml"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-apply.yml"
      - ".terraformignore"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/cognito/**"
      - ".github/scripts/cognito/**"
      - ".github/terraform/**"
      - ".github/scripts/terraform/**"
      - ".github/workflows/cognito-user-administration.yml"
      - ".github/workflows/terraform-validate.yml"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-apply.yml"
      - ".terraformignore"

permissions:
  contents: read
  pull-requests: read

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        if: hashFiles('infra/terraform/cognito/.terraform.lock.hcl') == ''
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Generate missing Cognito provider lock
        id: cognito_lock
        if: hashFiles('infra/terraform/cognito/.terraform.lock.hcl') == ''
        working-directory: infra/terraform/cognito
        run: |
          terraform providers lock \
            -platform=linux_amd64 \
            -platform=darwin_amd64 \
            -platform=darwin_arm64
          digest="$(sha256sum .terraform.lock.hcl | cut -d' ' -f1)"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: steps.cognito_lock.outcome == 'success'
        with:
          name: terraform-provider-lock-cognito
          path: infra/terraform/cognito/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 1
      - name: Require reviewed lock file
        if: steps.cognito_lock.outcome == 'success'
        env:
          LOCK_DIGEST: ${{ steps.cognito_lock.outputs.digest }}
        run: |
          {
            echo "::error::The Cognito provider lock file was missing."
            echo "Download artifact terraform-provider-lock-cognito from run $GITHUB_RUN_ID."
            echo "Verify SHA-256: $LOCK_DIGEST"
            echo "Stage infra/terraform/cognito/.terraform.lock.hcl on this feature branch and rerun validation."
            echo "Do not execute Terraform locally."
          } >&2
          exit 1

  catalog:
    needs: lockfiles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.components.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - id: components
        run: |
          .github/scripts/terraform/tests/test-component-catalog.sh
          printf 'matrix=%s\n' "$(jq -c '[.components | keys[]]' .github/terraform/components.json)" >>"$GITHUB_OUTPUT"
      - name: Lint workflows and shell
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          shellcheck -e SC1090,SC1091 .github/scripts/terraform/*.sh .github/scripts/terraform/tests/*.sh
          shellcheck -e SC1090,SC1091 .github/scripts/cognito/*.sh .github/scripts/cognito/tests/*.sh
          ruby --version
      - name: Validate Cognito contracts and guards
        env:
          CREWSAFE_AWS_ACCOUNTS_JSON: ${{ vars.CREWSAFE_AWS_ACCOUNTS_JSON }}
        run: |
          for test_script in .github/scripts/cognito/tests/test-*.sh; do
            "$test_script"
          done
      - run: |
          .github/scripts/terraform/tests/test-account-and-oidc-guards.sh
          .github/scripts/terraform/tests/test-ecr-web-source-guard.sh
          .github/scripts/terraform/tests/test-securityhub-inspector-source-guard.sh
          .github/scripts/terraform/tests/test-securityhub-inspector-runbook.sh
          .github/scripts/terraform/tests/test-securityhub-import-source-guard.sh
          .github/scripts/terraform/tests/test-securityhub-import-runbook.sh
          .github/scripts/terraform/tests/test-plan-metadata.sh
          .github/scripts/terraform/tests/test-workflow-guards.sh
          .github/scripts/terraform/tests/test-iam-policy-boundary.sh
          .github/scripts/terraform/tests/test-ci-guards.sh
          .github/scripts/terraform/tests/test-bootstrap-plan-portability.sh

  terraform:
    needs: catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - id: component
        run: .github/scripts/terraform/resolve-component.sh "${{ matrix.component }}"
      - name: Check formatting
        run: terraform fmt -check -diff -recursive "${{ steps.component.outputs.root }}"
      - name: Initialize without remote backend
        working-directory: ${{ steps.component.outputs.root }}
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate and test
        working-directory: ${{ steps.component.outputs.root }}
        run: |
          terraform validate
          terraform test -no-color

  security:
    runs-on: ubuntu-latest
    # Secret scanning moved to .github/workflows/security-scan.yml (SCRUM-178).
    # The gitleaks step that used to live here only ran when a Terraform or
    # Cognito path changed, because this workflow is path-filtered -- so a
    # backend-only pull request got no secret scan at all. The replacement runs
    # on every pull request and push, scans the PR's full commit range, and
    # sweeps the whole history weekly.
    #
    # Trivy stays: it scans Terraform configuration for misconfiguration, which
    # is a different concern from secret detection.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
