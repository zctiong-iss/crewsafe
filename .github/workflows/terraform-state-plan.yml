name: Terraform State Plan

on:
  workflow_dispatch:
    inputs:
      target_account_alias:
        description: Registered account alias from CREWSAFE_AWS_ACCOUNTS_JSON
        required: true
        type: string
      terraform_component:
        description: Terraform component to plan
        required: true
        type: choice
        default: state-backend
        options:
          - state-backend

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ inputs.target_account_alias }}-${{ inputs.terraform_component }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ROOT: infra/terraform/bootstrap/state

jobs:
  plan:
    name: Plan ${{ inputs.terraform_component }} for ${{ inputs.target_account_alias }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve selected account
        id: account
        env:
          CREWSAFE_AWS_ACCOUNTS_JSON: ${{ vars.CREWSAFE_AWS_ACCOUNTS_JSON }}
          ACCOUNT_ALIAS: ${{ inputs.target_account_alias }}
        run: .github/scripts/resolve-terraform-account.sh "$ACCOUNT_ALIAS"

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ steps.account.outputs.plan_role_arn }}
          aws-region: ${{ steps.account.outputs.region }}
          role-session-name: CrewSafePlan-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify authenticated account
        env:
          EXPECTED_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: |
          set -euo pipefail
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$actual_account_id" != "$EXPECTED_ACCOUNT_ID" ]]; then
            echo "::error::OIDC credentials belong to a different AWS account."
            exit 1
          fi

      - name: Inspect backend
        id: backend
        env:
          ACCOUNT_ALIAS: ${{ inputs.target_account_alias }}
          STATE_BUCKET: ${{ steps.account.outputs.bucket }}
          AWS_REGION: ${{ steps.account.outputs.region }}
        run: |
          .github/scripts/inspect-state-bucket.sh \
            "$STATE_BUCKET" \
            "$ACCOUNT_ALIAS" \
            "$AWS_REGION"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: ${{ env.TF_ROOT }}
        env:
          BACKEND_MODE: ${{ steps.backend.outputs.mode }}
          STATE_BUCKET: ${{ steps.account.outputs.bucket }}
          AWS_REGION: ${{ steps.account.outputs.region }}
        run: |
          set -euo pipefail
          if [[ "$BACKEND_MODE" == "bootstrap" ]]; then
            terraform init -backend=false -input=false -lockfile=readonly
          else
            "$GITHUB_WORKSPACE/.github/scripts/write-backend-config.sh" \
              "$STATE_BUCKET" "$AWS_REGION"
            terraform init -input=false -lockfile=readonly -reconfigure \
              -backend-config=.backend/state.s3.tfbackend
          fi

      - name: Create saved plan
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_VAR_expected_account_id: ${{ steps.account.outputs.account_id }}
          TF_VAR_account_alias: ${{ inputs.target_account_alias }}
          TF_VAR_aws_region: ${{ steps.account.outputs.region }}
        run: terraform plan -input=false -lock-timeout=5m -out=plan.tfplan

      - name: Build sanitized plan bundle
        working-directory: ${{ env.TF_ROOT }}
        env:
          ACCOUNT_ALIAS: ${{ inputs.target_account_alias }}
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          AWS_REGION: ${{ steps.account.outputs.region }}
          STATE_BUCKET: ${{ steps.account.outputs.bucket }}
          BACKEND_MODE: ${{ steps.backend.outputs.mode }}
          PLAN_ACTOR: ${{ github.actor }}
          PLAN_RUN_ID: ${{ github.run_id }}
          PLANNED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/plan-bundle"
          mkdir -p "$bundle"
          cp plan.tfplan "$bundle/plan.tfplan"
          terraform show -no-color plan.tfplan >"$RUNNER_TEMP/plan-summary.txt"
          plan_hash="$(sha256sum "$bundle/plan.tfplan" | cut -d' ' -f1)"
          lock_hash="$(sha256sum .terraform.lock.hcl | cut -d' ' -f1)"
          terraform_version="$(terraform version -json | jq -r '.terraform_version')"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --argjson schema_version 1 \
            --arg source_workflow "terraform-state-plan.yml" \
            --arg terraform_component "state-backend" \
            --arg account_alias "$ACCOUNT_ALIAS" \
            --arg account_id "$ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            --arg bucket "$STATE_BUCKET" \
            --arg mode "$BACKEND_MODE" \
            --arg plan_actor "$PLAN_ACTOR" \
            --arg plan_run_id "$PLAN_RUN_ID" \
            --arg commit "$PLANNED_COMMIT" \
            --arg terraform_version "$terraform_version" \
            --arg lock_sha256 "$lock_hash" \
            --arg plan_sha256 "$plan_hash" \
            --arg created_at "$created_at" \
            '{
              schema_version: $schema_version,
              source_workflow: $source_workflow,
              terraform_component: $terraform_component,
              account_alias: $account_alias,
              account_id: $account_id,
              region: $region,
              bucket: $bucket,
              mode: $mode,
              plan_actor: $plan_actor,
              plan_run_id: $plan_run_id,
              commit: $commit,
              terraform_version: $terraform_version,
              lock_sha256: $lock_sha256,
              plan_sha256: $plan_sha256,
              created_at: $created_at
            }' >"$bundle/metadata.json"
          {
            echo "## Terraform state plan"
            echo
            echo "- Account alias: \`$ACCOUNT_ALIAS\`"
            echo "- Region: \`$AWS_REGION\`"
            echo "- Bucket: \`$STATE_BUCKET\`"
            echo "- Mode: \`$BACKEND_MODE\`"
            echo "- Commit: \`$PLANNED_COMMIT\`"
            echo "- Plan SHA-256: \`$plan_hash\`"
            echo
            echo '```text'
            sed -n '1,300p' "$RUNNER_TEMP/plan-summary.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload reviewed plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-state-plan-${{ github.run_id }}
          path: plan-bundle/
          if-no-files-found: error
          retention-days: 1
