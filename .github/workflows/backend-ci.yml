name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/scripts/deploy/deploy-backend-staging.sh"
      - ".github/scripts/security/filter-trivyignore.sh"
      - ".github/scripts/security/summarize-trivy-report.sh"
      - ".github/scripts/security/validate-trivy-exceptions.sh"
      - ".github/scripts/tests/test-backend-image-workflow.sh"
      - ".github/scripts/tests/test-filter-trivyignore.sh"
      - ".github/scripts/tests/test-summarize-trivy-report.sh"
      - ".github/scripts/tests/test-validate-trivy-exceptions.sh"
      - ".github/security/backend-image.trivyignore.source"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/scripts/deploy/deploy-backend-staging.sh"
      - ".github/scripts/security/filter-trivyignore.sh"
      - ".github/scripts/security/summarize-trivy-report.sh"
      - ".github/scripts/security/validate-trivy-exceptions.sh"
      - ".github/scripts/tests/test-backend-image-workflow.sh"
      - ".github/scripts/tests/test-filter-trivyignore.sh"
      - ".github/scripts/tests/test-summarize-trivy-report.sh"
      - ".github/scripts/tests/test-validate-trivy-exceptions.sh"
      - ".github/security/backend-image.trivyignore.source"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also build and push the image to ECR (main only)"
        type: boolean
        default: false
      redeploy:
        description: "Redeploy an approved main-ancestor commit's existing immutable image without publishing"
        type: boolean
        default: false
      redeploy_image_tag:
        description: "Full approved commit SHA of an existing backend image that is reachable from main"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify
      # SCRUM-455: validate that the Dockerfile builds from the Maven-tested
      # checkout on every CI run. This runner-local tag has no registry host;
      # publication remains exclusively in the credentialed publish-image job.
      - name: Build backend container image
        run: docker build -t "crewsafe-backend-ci:${GITHUB_SHA}" .

  publish-image:
    name: Publish image
    needs: build-test
    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.redeploy)
      ) &&
      vars.CREWSAFE_ECR_PUSH_ROLE_ARN != '' && vars.CREWSAFE_ECR_REPOSITORY_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}
      image_tag: ${{ steps.publish.outputs.image_tag }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
      run_id: ${{ steps.publish.outputs.run_id }}
      run_url: ${{ steps.publish.outputs.run_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # SCRUM-270 (User Story 2): fails fast on a bad repository, role, or
      # tag before any build/scan/AWS-credentialed step runs, mirroring
      # web-ci.yml's own publication-contract validation.
      - name: Validate backend publication contract
        env:
          REPO: ${{ vars.CREWSAFE_ECR_REPOSITORY_URL }}
          PUSH_ROLE_ARN: ${{ vars.CREWSAFE_ECR_PUSH_ROLE_ARN }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$REPO" ]] || { echo "Missing CREWSAFE_ECR_REPOSITORY_URL" >&2; exit 1; }
          [[ "$REPO" =~ ^[0-9]{12}\.dkr\.ecr\.ap-southeast-1\.amazonaws\.com/crewsafe/backend$ ]] || { echo "Backend repository must be the regional ECR crewsafe/backend repository" >&2; exit 1; }
          [[ -n "$PUSH_ROLE_ARN" ]] || { echo "Missing CREWSAFE_ECR_PUSH_ROLE_ARN" >&2; exit 1; }
          [[ "$PUSH_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/crewsafe-shared-dev-ecr-push$ ]] || { echo "Unexpected backend publisher role" >&2; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "GITHUB_SHA must be a 40-character lowercase commit SHA" >&2; exit 1; }
          printf 'Validated repository=%s role=%s tag=%s\n' "$REPO" "$PUSH_ROLE_ARN" "$SHA"
      - name: Build backend image
        env:
          REPO: ${{ vars.CREWSAFE_ECR_REPOSITORY_URL }}
          SHA: ${{ github.sha }}
        run: docker build -t "$REPO:$SHA" backend
      - name: Validate backend Trivy exceptions
        run: .github/scripts/security/validate-trivy-exceptions.sh .github/security/backend-image.trivyignore.source
      # SCRUM-269 (User Story 3): filters the reviewed source ignorefile down
      # to only its non-expired entries. trivyignores requires a path
      # RELATIVE TO THE REPOSITORY (verified against the scan action's own
      # docs -- an absolute $RUNNER_TEMP path is not accepted), so the
      # active file is written inside the checkout; it is gitignored
      # (.trivyignore-active-*) and never committed.
      - name: Prepare Trivy ignorefile
        run: |
          .github/scripts/security/filter-trivyignore.sh \
            .github/security/backend-image.trivyignore.source \
            .trivyignore-active-backend
      # SCRUM-455: unapproved HIGH/CRITICAL findings block publication. The
      # summary and artifact still run after a failed scan so the reviewer has
      # redacted evidence without granting the job a soft-fail path.
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ vars.CREWSAFE_ECR_REPOSITORY_URL }}:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-backend-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          trivyignores: .trivyignore-active-backend
      - name: Summarize backend image scan
        if: always()
        env:
          IMAGE: ${{ vars.CREWSAFE_ECR_REPOSITORY_URL }}:${{ github.sha }}
          EXCEPTIONS: .trivyignore-active-backend
        run: .github/scripts/security/summarize-trivy-report.sh trivy-backend-report.json "$GITHUB_STEP_SUMMARY" "$IMAGE" "${GITHUB_SHA::12}" "Backend image vulnerability scan" "$EXCEPTIONS"
      - name: Upload backend Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-backend-report
          path: trivy-backend-report.json
          if-no-files-found: error
          retention-days: 7
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.CREWSAFE_ECR_PUSH_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: CrewSafeBackendPublish-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region ap-southeast-1 \
            | docker login --username AWS --password-stdin "${{ vars.CREWSAFE_ECR_REPOSITORY_URL }}"
      # SCRUM-270 (User Story 1): captures the pushed image's content digest
      # (the only truly immutable reference -- a tag can be overwritten in
      # the registry, a digest cannot), validates its shape, and surfaces
      # image_uri/image_tag/image_digest/run_id/run_url as both job outputs
      # and job-summary evidence, mirroring web-ci.yml's `id: publish` step.
      - name: Push backend image and record digest
        id: publish
        env:
          REPO: ${{ vars.CREWSAFE_ECR_REPOSITORY_URL }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$REPO:$SHA"
          image_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$REPO:$SHA" | sed 's/.*@//')"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No valid pushed image digest was returned" >&2; exit 1; }
          {
            echo "image_uri=$REPO:$SHA"
            echo "image_tag=$SHA"
            echo "image_digest=$image_digest"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Backend image publication'
            echo "- Image URI: \`$REPO:$SHA\`"
            echo "- Commit tag: \`$SHA\`"
            echo "- Content digest: \`$image_digest\`"
            echo "- CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  # SCRUM-242: a task-start SSM change must be followed by fresh tasks, but
  # its previously approved backend release may predate the current workflow
  # correction. ECR intentionally rejects a second push of that immutable SHA
  # tag. This branch accepts a full approved commit SHA, proves it is reachable from the
  # selected main ref, then resolves its image using the existing deploy role.
  # It accepts no repository, image URI, or digest, never builds/pushes, and
  # must scan the resolved digest before its job can feed deployment.
  resolve-existing-image:
    name: Resolve existing image
    needs: build-test
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.redeploy && !inputs.publish &&
      vars.CREWSAFE_BACKEND_DEPLOY_ROLE_ARN != '' && vars.CREWSAFE_ECR_REPOSITORY_URL != ''
    runs-on: ubuntu-latest
    env:
      REPO: ${{ vars.CREWSAFE_ECR_REPOSITORY_URL }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      image_digest: ${{ steps.resolve.outputs.image_digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Validate existing-image redeploy contract
        env:
          REPO: ${{ vars.CREWSAFE_ECR_REPOSITORY_URL }}
          DEPLOY_ROLE_ARN: ${{ vars.CREWSAFE_BACKEND_DEPLOY_ROLE_ARN }}
          IMAGE_TAG: ${{ inputs.redeploy_image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPO" =~ ^[0-9]{12}\.dkr\.ecr\.ap-southeast-1\.amazonaws\.com/crewsafe/backend$ ]] || { echo "Backend repository must be the regional ECR crewsafe/backend repository" >&2; exit 1; }
          [[ "$DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/crewsafe-shared-dev-backend-deploy$ ]] || { echo "Unexpected backend deployment role" >&2; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "redeploy_image_tag must be a 40-character lowercase commit SHA" >&2; exit 1; }
          git cat-file -e "$IMAGE_TAG^{commit}" || { echo "redeploy_image_tag is not a repository commit" >&2; exit 1; }
          git merge-base --is-ancestor "$IMAGE_TAG" "$GITHUB_SHA" || { echo "redeploy_image_tag is not reachable from selected main" >&2; exit 1; }
      - name: Validate backend Trivy exceptions for redeploy
        run: .github/scripts/security/validate-trivy-exceptions.sh .github/security/backend-image.trivyignore.source
      - name: Prepare active backend Trivy ignorefile for redeploy
        run: .github/scripts/security/filter-trivyignore.sh .github/security/backend-image.trivyignore.source .trivyignore-active-backend
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.CREWSAFE_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: CrewSafeBackendRedeploy-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Resolve selected main image digest
        id: resolve
        env:
          IMAGE_TAG: ${{ inputs.redeploy_image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          image_digest="$(aws ecr describe-images --repository-name crewsafe/backend --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No immutable digest exists for approved commit" >&2; exit 1; }
          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_digest=$image_digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Existing backend image resolved'
            echo "- Approved commit tag: \`$IMAGE_TAG\`"
            echo "- Content digest: \`$image_digest\`"
            echo '- Result: resolved candidate pending vulnerability gate'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to ECR for backend redeploy scan
        run: |
          aws ecr get-login-password --region ap-southeast-1 \
            | docker login --username AWS --password-stdin "${{ vars.CREWSAFE_ECR_REPOSITORY_URL }}"
      - name: Scan existing backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "${{ env.REPO }}@${{ steps.resolve.outputs.image_digest }}"
          scanners: vuln
          format: json
          output: trivy-backend-redeploy-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          trivyignores: .trivyignore-active-backend
      - name: Summarize existing backend image scan
        if: always()
        env:
          IMAGE: "${{ env.REPO }}@${{ steps.resolve.outputs.image_digest }}"
          IMAGE_TAG: "${{ inputs.redeploy_image_tag }}"
          EXCEPTIONS: .trivyignore-active-backend
        run: .github/scripts/security/summarize-trivy-report.sh trivy-backend-redeploy-report.json "$GITHUB_STEP_SUMMARY" "$IMAGE" "$IMAGE_TAG" "Backend image vulnerability scan" "$EXCEPTIONS"
      - name: Upload existing backend Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-backend-redeploy-report
          path: trivy-backend-redeploy-report.json
          if-no-files-found: error
          retention-days: 7

  deploy-staging:
    name: Deploy staging backend
    needs: [build-test, publish-image, resolve-existing-image]
    if: >
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.build-test.result == 'success' &&
      (needs.publish-image.result == 'success' || needs.resolve-existing-image.result == 'success') &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && ((inputs.publish && !inputs.redeploy) || (inputs.redeploy && !inputs.publish)))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      deployed_revision: ${{ steps.deploy.outputs.deployed_revision }}
    env:
      REPOSITORY: ${{ vars.CREWSAFE_ECR_REPOSITORY_URL }}
      IMAGE_TAG: ${{ needs.publish-image.outputs.image_tag || needs.resolve-existing-image.outputs.image_tag }}
      IMAGE_DIGEST: ${{ needs.publish-image.outputs.image_digest || needs.resolve-existing-image.outputs.image_digest }}
      CLUSTER: ${{ vars.CREWSAFE_BACKEND_ECS_CLUSTER_NAME }}
      SERVICE: ${{ vars.CREWSAFE_BACKEND_ECS_SERVICE_NAME }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate backend deployment contract
        env:
          DEPLOY_ROLE_ARN: ${{ vars.CREWSAFE_BACKEND_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/crewsafe-shared-dev-backend-deploy$ ]]
          [[ "$CLUSTER" == crewsafe-shared-dev && "$SERVICE" == backend ]]
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.CREWSAFE_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: CrewSafeBackendDeploy-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Deploy immutable backend release
        id: deploy
        run: .github/scripts/deploy/deploy-backend-staging.sh

  smoke-staging:
    name: Staging smoke verification
    needs: deploy-staging
    if: always() && needs.deploy-staging.result == 'success'
    uses: ./.github/workflows/staging-smoke.yml
    permissions:
      contents: read
    with:
      trigger_component: backend
      trigger_sha: ${{ needs.deploy-staging.outputs.deployed_revision }}
      web_base_url: ${{ vars.CREWSAFE_WEB_BASE_URL }}
      backend_base_url: ${{ vars.CREWSAFE_BACKEND_BASE_URL }}
      approved_web_base_url: ${{ vars.CREWSAFE_DAST_APPROVED_WEB_BASE_URL }}
      approved_backend_base_url: ${{ vars.CREWSAFE_DAST_APPROVED_BACKEND_BASE_URL }}
      smoke_site_id: ${{ vars.CREWSAFE_SMOKE_SITE_ID }}
      smoke_username: ${{ vars.CREWSAFE_SMOKE_SYNTHETIC_WORKER_USERNAME }}
      cognito_config_json: ${{ vars.CREWSAFE_SHARED_COGNITO_JSON }}
    secrets:
      SMOKE_SYNTHETIC_WORKER_PASSWORD: ${{ secrets.SMOKE_SYNTHETIC_WORKER_PASSWORD }}

  dast-staging:
    name: Authenticated staging DAST
    needs: deploy-staging
    # always() is required here: deploy-staging needs both publish-image and
    # resolve-existing-image, and exactly one of that pair is always skipped
    # (the redeploy-vs-publish branch). GitHub's implicit success() gate on a
    # job's `if:` propagates through that skipped grandparent even though
    # deploy-staging's own result is success, so without always() this job
    # was silently skipped on every ordinary push-triggered deployment.
    if: always() && needs.deploy-staging.result == 'success'
    uses: ./.github/workflows/dast-staging.yml
    permissions:
      contents: read
    with:
      trigger_component: backend
      trigger_sha: ${{ github.sha }}
      web_base_url: ${{ vars.CREWSAFE_WEB_BASE_URL }}
      backend_base_url: ${{ vars.CREWSAFE_BACKEND_BASE_URL }}
      approved_web_base_url: ${{ vars.CREWSAFE_DAST_APPROVED_WEB_BASE_URL }}
      approved_backend_base_url: ${{ vars.CREWSAFE_DAST_APPROVED_BACKEND_BASE_URL }}
      hosted_ui_url: ${{ fromJSON(vars.CREWSAFE_SHARED_COGNITO_JSON).accounts.dev.hosted_ui_url }}
      dast_username: ${{ vars.CREWSAFE_DAST_SYNTHETIC_WORKER_USERNAME }}
    secrets:
      DAST_SYNTHETIC_WORKER_PASSWORD: ${{ secrets.DAST_SYNTHETIC_WORKER_PASSWORD }}
