# SCRUM-350. Maestro flow (ADR 0016, research.md R7) driving the synthetic dynamic-scan
# session: launch -> sign-in -> one authenticated API call -> acknowledgement -> sign-out
# (FR-005). Every element is matched by its rendered English label text
# (mobile/src/localization/en.json) -- the app has no stable testID props on these elements
# today, and adding them is out of scope for this feature (no mobile application source is
# modified by SCRUM-350 beyond the auth_mode build input). Text-based matching is
# locale-dependent (the app defaults to English; verify this still holds at the point this
# flow is first run for real -- quickstart.md / T041) and is the accepted tradeoff here,
# consistent with the fail-closed design: if the app's UI has drifted from this flow, Maestro
# fails the step, which correctly produces a no-coverage-evidence outcome (FR-016) rather
# than a silent false pass.
#
# Requires: the synthetic worker account (demo-worker, .github/cognito/synthetic-users.yml)
# has at least one pending action-dispatch item seeded in staging for the Acknowledge step to
# have something to tap -- see docs/runbooks/SCRUM-350-mobsf-dynamic-scanning.md for how to
# seed one. Credentials are injected only via Maestro's -e flag at invocation time
# (MAESTRO_SYNTHETIC_USERNAME / MAESTRO_SYNTHETIC_PASSWORD), never hardcoded here.
appId: sg.crewsafe.mobile
---
- launchApp
# Sign in (cognito-password mode -- the artifact this flow runs against was built with
# auth_mode=cognito-password, mobile/README.md's phone-friendly, no-browser flow).
- tapOn: "Username"
- inputText: "${MAESTRO_SYNTHETIC_USERNAME}"
- tapOn: "Password"
- inputText: "${MAESTRO_SYNTHETIC_PASSWORD}"
- tapOn: "Sign in"
- assertVisible: "My shift"
# Authenticated API call: the Alerts tab loads GET /api/action-dispatch/worker/{id}/pending
# on mount (mobile/src/screens/worker/InboxScreen.tsx).
- tapOn: "Alerts"
# Acknowledgement action.
- tapOn: "Acknowledge"
- assertVisible: "Acknowledged"
# Sign out (Profile tab -> Sign out).
- tapOn: "Profile"
- tapOn: "Sign out"
