# SonarQube Cloud configuration for WBGT CrewSafe SG (SCRUM-178).
# See docs/adr/0010-sonarqube-cloud-for-sast.md for why this provider, and
# docs/runbooks/SCRUM-178-sast-and-secret-scanning.md for how to operate it.
#
# This file is read NATIVELY by the SonarSource/sonarqube-scan-action step in
# .github/workflows/security-scan.yml (the standalone sonar-scanner CLI), which
# is what this file format is designed for -- no custom loading logic needed.
#
# It is NOT read by the Maven Sonar plugin (org.sonarsource.scanner.maven),
# which this repo used previously and does not consume this file at all. That
# mismatch caused two failures in sequence (SCRUM-178, 2026-08-06): first a
# "must define sonar.organization" error, then -- after a workaround that
# manually loaded these properties into Maven -D flags -- a silent one, where
# web/ and mobile/ were dropped from analysis because the Sonar Maven plugin
# resolves sonar.sources relative to the invoked module's own basedir and
# skips paths outside it, a documented upstream limitation that
# sonar.projectBaseDir does not fix for a non-multi-module Maven project. The
# switch to the standalone scanner action removes the whole class of problem:
# it has no Maven module-scoping concept, and it loads this file directly.

sonar.projectKey=zctiong-iss_crewsafe
sonar.organization=zctiong-iss
sonar.host.url=https://sonarcloud.io

sonar.projectName=Crewsafe
sonar.sourceEncoding=UTF-8

# --- analysed sources -------------------------------------------------------
# web/ and mobile/ landed real TypeScript/React source during this branch's
# lifetime (SCRUM-161/172/186 for mobile), and ml-service/ now contains the
# Python FastAPI spike, so all three application areas are analysed.
#
# All paths are relative to the REPOSITORY ROOT. That is simply correct here:
# the scan action's default sonar.projectBaseDir is ".", and it runs from the
# checkout root, so no override or path rewriting is needed for any of this to
# resolve -- backend/, web/, and mobile/ are all reached directly.
#
# Before adding a path here, verify free-plan line-of-code headroom (FR-020).
# The scope includes application code plus infrastructure and deployment
# definitions so security analysis does not silently stop at runtime sources.
sonar.sources=backend/src/main,web/src,web/vite.config.ts,mobile/src,mobile/App.tsx,mobile/index.ts,mobile/app.json,ml-service,infra/terraform,.github/workflows,.github/scripts,.github/terraform,.github/cognito,backend/Dockerfile,web/Dockerfile,web/nginx.conf,local/compose.yaml
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/dependency/*.jar
sonar.java.test.libraries=backend/target/dependency/*.jar,backend/target/test-dependency/*.jar

# Mobile Jest emits LCOV paths relative to mobile/. The SAST job normalizes the
# report to repository-root paths before the standalone scanner consumes it.
sonar.javascript.lcov.reportPaths=mobile/coverage/sonar-lcov.info
sonar.typescript.tsconfigPaths=web/tsconfig.json,mobile/tsconfig.json
sonar.python.version=3.11
sonar.python.coverage.reportPaths=ml-service/coverage.xml

# The repository's migrations are PostgreSQL SQL, not Oracle PL/SQL. Keep the
# PL/SQL analyzer available for Oracle-specific suffixes without treating .sql
# migrations as PL/SQL that requires an Oracle data dictionary.
sonar.plsql.file.suffixes=.pls,.plb,.pck,.pkb,.pks

# Test files are interspersed with source, not in a separate tree (e.g.
# web/src/auth/signOut.test.tsx sits next to signOut.ts). Sonar recommends
# sonar.tests point at the SAME root as sonar.sources in that layout, combined
# with sonar.test.inclusions to identify which files are tests -- pointing
# sonar.tests at whole directories instead would make every web/mobile file
# count as a test and exempt all of it from the security Quality Gate.
sonar.tests=backend/src/test,web/src,mobile/src,ml-service
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,backend/src/test/**,ml-service/test_*.py

# --- coverage -----------------------------------------------------------------
# Fed by backend/pom.xml's jacoco-maven-plugin (bound to the test phase), so
# the Quality Gate's "Coverage on New Code" condition reflects real numbers
# instead of the 0% it showed with no coverage plugin at all (SCRUM-168).
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# --- exclusions -------------------------------------------------------------
# Generated/vendored build output, and documentation. Never use this to
# silence a finding in hand-written APPLICATION code -- that is what a
# justified, reviewable suppression is for (see the runbook). docs/ is markdown
# only, carries no application logic to gate on, and was never listed in
# sonar.sources -- but sonar.exclusions applies project-wide across all
# sensors (IaC/CloudFormation/Kustomization/ARM classification among them),
# unlike sonar.sources, which only scopes language-specific issue detection.
# Without it here, docs/**/*.yml examples and similar were still being swept
# into preprocessing by those broader sensors.
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/coverage/**,**/.expo/**,**/.terraform/**,**/*.tfstate*,**/*.tfplan,**/*.min.js,web/tsconfig.tsbuildinfo,docs/**

# --- Quality Gate -----------------------------------------------------------
# The gate itself is defined in the SonarQube Cloud UI, not here. As of
# 2026-08-04 the free plan does not permit a custom gate -- see the addendum in
# docs/adr/0010-sonarqube-cloud-for-sast.md. The project currently runs on the
# default "Sonar way" gate, which includes a coverage condition; backend/pom.xml's
# jacoco-maven-plugin (see the coverage section above, SCRUM-168) now feeds it
# real numbers. This is a known, accepted
# interim state: required status checks on main have been deliberately left
# off until a custom security-only gate is available (see
# docs/runbooks/SCRUM-178-manual-setup.md).
#
# Blocking behaviour is enforced in CI by sonar.qualitygate.wait=true; without
# that flag the analysis step exits 0 whatever the gate says.
