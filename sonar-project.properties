# SonarQube Cloud configuration for WBGT CrewSafe SG (SCRUM-178).
# See docs/adr/0010-sonarqube-cloud-for-sast.md for why this provider, and
# docs/runbooks/SCRUM-178-sast-and-secret-scanning.md for how to operate it.
#
# This file is read NATIVELY by the SonarSource/sonarqube-scan-action step in
# .github/workflows/security-scan.yml (the standalone sonar-scanner CLI), which
# is what this file format is designed for -- no custom loading logic needed.
#
# It is NOT read by the Maven Sonar plugin (org.sonarsource.scanner.maven),
# which this repo used previously and does not consume this file at all. That
# mismatch caused two failures in sequence (SCRUM-178, 2026-08-06): first a
# "must define sonar.organization" error, then -- after a workaround that
# manually loaded these properties into Maven -D flags -- a silent one, where
# web/ and mobile/ were dropped from analysis because the Sonar Maven plugin
# resolves sonar.sources relative to the invoked module's own basedir and
# skips paths outside it, a documented upstream limitation that
# sonar.projectBaseDir does not fix for a non-multi-module Maven project. The
# switch to the standalone scanner action removes the whole class of problem:
# it has no Maven module-scoping concept, and it loads this file directly.

sonar.projectKey=zctiong-iss_crewsafe
sonar.organization=zctiong-iss
sonar.host.url=https://sonarcloud.io

sonar.projectName=Crewsafe
sonar.sourceEncoding=UTF-8

# --- analysed sources -------------------------------------------------------
# web/ and mobile/ landed real TypeScript/React source during this branch's
# lifetime (SCRUM-161/172/186 for mobile), so both are analysed now rather than
# left as a future TODO. ml-service/ remains a .gitkeep placeholder -- listing a
# path with no analysable source is harmless, so it stays listed for when it
# too gains source (FR-004, US3).
#
# All paths are relative to the REPOSITORY ROOT. That is simply correct here:
# the scan action's default sonar.projectBaseDir is ".", and it runs from the
# checkout root, so no override or path rewriting is needed for any of this to
# resolve -- backend/, web/, and mobile/ are all reached directly.
#
# Before adding a path here, verify free-plan line-of-code headroom (FR-020).
sonar.sources=backend/src/main,web/src,mobile/src,mobile/App.tsx,mobile/index.ts,ml-service
sonar.java.binaries=backend/target/classes

# Test files are interspersed with source, not in a separate tree (e.g.
# web/src/auth/signOut.test.tsx sits next to signOut.ts). Sonar recommends
# sonar.tests point at the SAME root as sonar.sources in that layout, combined
# with sonar.test.inclusions to identify which files are tests -- pointing
# sonar.tests at whole directories instead would make every web/mobile file
# count as a test and exempt all of it from the security Quality Gate.
sonar.tests=backend/src/test,web/src,mobile/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,backend/src/test/**

# --- exclusions -------------------------------------------------------------
# Generated and vendored content ONLY. Never use this to silence a finding in
# hand-written code -- that is what a justified, reviewable suppression is for.
sonar.exclusions=backend/target/**,**/node_modules/**,**/*.min.js,web/dist/**,web/tsconfig.tsbuildinfo,mobile/.expo/**

# --- Quality Gate -----------------------------------------------------------
# The gate itself is defined in the SonarQube Cloud UI, not here. As of
# 2026-08-04 the free plan does not permit a custom gate -- see the addendum in
# docs/adr/0010-sonarqube-cloud-for-sast.md. The project currently runs on the
# default "Sonar way" gate, which includes a coverage condition that
# backend/pom.xml cannot satisfy (no JaCoCo plugin). This is a known, accepted
# interim state: required status checks on main have been deliberately left
# off until a custom security-only gate is available (see
# docs/runbooks/SCRUM-178-manual-setup.md).
#
# Blocking behaviour is enforced in CI by sonar.qualitygate.wait=true; without
# that flag the analysis step exits 0 whatever the gate says.
