services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=ap-southeast-1
      - LOG_LEVEL=INFO
    volumes:
      - ./ml-service:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  ml-service-test:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    depends_on:
      - ml-service
    environment:
      - AWS_REGION=ap-southeast-1
    volumes:
      - ./ml-service:/app
    command: pytest test_forecast.py -v --tb=short
    profiles:
      - test
