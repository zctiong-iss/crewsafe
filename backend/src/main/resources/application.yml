spring:
  application:
    name: crewsafe-backend

  datasource:
    # Local default points at the container in infra/local/compose.yaml (host port 5434).
    # Staging and production inject these from AWS Secrets Manager.
    url: ${DB_URL:jdbc:postgresql://localhost:5434/crewsafe}
    username: ${DB_USERNAME:crewsafe}
    password: ${DB_PASSWORD:crewsafe_local_dev}

  jpa:
    # Flyway owns the schema. Hibernate must never alter it — 'validate' makes a drift
    # between entities and migrations fail fast at startup instead of silently at runtime.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # HS256 signing secret, at least 256 bits. No default - the application refuses to
    # start without JWT_SECRET rather than signing tokens with a guessable key.
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    issuer: crewsafe

  seed:
    # Password for the synthetic demo accounts, hashed with BCrypt before storage.
    # Local/staging profiles only. Blank means "do not seed" - there is deliberately
    # no default credential.
    password: ${SEED_USER_PASSWORD:}

# Expose only what we need. Health is used by the container platform and the
# smoke tests; everything else stays closed by default.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.crewsafe: DEBUG
