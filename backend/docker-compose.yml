version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crewsafe-postgres
    environment:
      POSTGRES_DB: crewsafe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: crewsafe-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crewsafe-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: crewsafe
      DB_USER: postgres
      DB_PASSWORD: crewsafe-dev-password
      COGNITO_ISSUER_URI: https://cognito-idp.ap-southeast-1.amazonaws.com/ap-southeast-1_xxxxxxxxx
      COGNITO_JWK_URI: https://cognito-idp.ap-southeast-1.amazonaws.com/ap-southeast-1_xxxxxxxxx/.well-known/jwks.json
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
