openapi: 3.0.3
info:
  title: WBGT CrewSafe SG API — Shift endpoints
  version: "1.3"
  description: >
    Contract for SCRUM-159 (US-02: create a shift with workers, tasks and intensity).
    Every operation is site-scoped: the caller must be a member of {siteId}
    (ADMIN excepted), enforced the same way as the existing /api/v1/sites endpoints —
    see SiteAccessEvaluator. A shift can be created with zero assignments and staffed
    afterward via the assignments endpoint.

    Extended for the SCRUM-159/160-fix: two gaps found building SCRUM-161 (the
    create-shift form) against the original contract. (1) Shifts and assignments were
    create/read/add-only — no way to correct a mistaken entry or remove one. PATCH/DELETE
    on a shift and PATCH/DELETE on an assignment close that; workerId is deliberately not
    patchable on an assignment — reassigning to a different worker is DELETE the wrong
    assignment, POST the right one, since that path already exists. (2) Nothing returned
    a site's workers, so a create-shift form had no way to populate a worker picker.
    GET /sites/{siteId}/workers closes that — it lives here rather than a separate site
    contract because its only consumer today is this form.

    Extended for SCRUM-255: DELETE erases a shift outright, with no way to keep "this
    shift didn't happen" on record for audit/history. POST .../shifts/{shiftId}/cancel
    adds that as a status transition (PLANNED or ACTIVE → CANCELLED) rather than a row
    removal; DELETE's behaviour is unchanged.

    Extended for SCRUM-442: CLOSED existed in ShiftStatus from the start but nothing
    ever set it. POST .../shifts/{shiftId}/close adds that as a status transition
    (PLANNED or ACTIVE → CLOSED) for a shift that ran, the counterpart to cancel for one
    that didn't — only once endsAt has passed; a shift cannot be closed early.

servers:
  - url: /

security:
  - bearerAuth: []

paths:
  /api/v1/sites/{siteId}/shifts:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: listShifts
      summary: List shifts for a site
      responses:
        "200":
          description: Shifts for this site, most recently created first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createShift
      summary: Create a shift for this site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftCreateRequest"
      responses:
        "201":
          description: The created shift, status PLANNED, including any assignments given at creation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Caller is not a member of {siteId} — creating a shift for a site you do not
            belong to is rejected the same way reading one is (SCRUM-156 / SCRUM-160).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/sites/{siteId}/shifts/{shiftId}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/ShiftId"
    get:
      operationId: getShift
      summary: Read one shift, including its assignments
      responses:
        "200":
          description: The shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No shift with this id exists under this site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateShift
      summary: Correct a shift's start/end times
      description: >
        Data-entry correction only, not a status transition — status stays
        server-controlled (see ShiftStatus) and is not settable here. Both fields are
        required, same as create, so the request is always a complete, valid time range
        rather than a partial patch that could combine with the existing value to
        produce an invalid one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftUpdateRequest"
      responses:
        "200":
          description: The corrected shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No shift with this id exists under this site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteShift
      summary: Remove a shift created in error
      description: Removes the shift and every assignment on it.
      responses:
        "204":
          description: The shift (and its assignments) no longer exist.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No shift with this id exists under this site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/sites/{siteId}/shifts/{shiftId}/cancel:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: cancelShift
      summary: Cancel a shift that was called off rather than run
      description: >
        Retains the shift and its assignments as a record — distinguishable from an
        active shift by status — rather than removing them the way DELETE does. Only a
        PLANNED or ACTIVE shift can be cancelled; a CLOSED or already-CANCELLED shift
        returns 400. Terminal: there is no un-cancel. A required reason is recorded to
        the audit trail only; it is never stored on the shift or returned in any payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelShiftRequest"
      responses:
        "200":
          description: The cancelled shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No shift with this id exists under this site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/sites/{siteId}/shifts/{shiftId}/close:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: closeShift
      summary: Close a shift that has naturally ended
      description: >
        The counterpart to cancel for a shift that ran rather than one that was called
        off. Only a PLANNED or ACTIVE shift can be closed, and only once endsAt is no
        longer after the current time — a shift cannot be closed early; use cancel for
        that. A CLOSED or CANCELLED shift returns 400. Terminal: there is no un-close.
      responses:
        "200":
          description: The closed shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No shift with this id exists under this site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/sites/{siteId}/shifts/{shiftId}/assignments:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: addShiftAssignment
      summary: Assign one more worker to an existing shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftAssignmentCreate"
      responses:
        "201":
          description: The full, updated shift with the new assignment included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No shift with this id exists under this site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/sites/{siteId}/shifts/{shiftId}/assignments/{assignmentId}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/ShiftId"
      - $ref: "#/components/parameters/AssignmentId"
    patch:
      operationId: updateShiftAssignment
      summary: Correct a worker's task, intensity or acclimatisation day on this shift
      description: >
        workerId is deliberately not part of this request — if the wrong worker was
        assigned, DELETE this assignment and POST the correct one via the assignments
        endpoint rather than reassigning in place. intensity is required, same as on
        create: it is never silently defaulted or left unchanged by omission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftAssignmentUpdateRequest"
      responses:
        "200":
          description: The full, updated shift with the corrected assignment included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No shift with this id exists under this site, or no assignment with this id exists on this shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeShiftAssignment
      summary: Take a worker off this shift
      responses:
        "204":
          description: The assignment no longer exists.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No shift with this id exists under this site, or no assignment with this id exists on this shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/sites/{siteId}/workers:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: listSiteWorkers
      summary: The site's active WORKER-role members, for a worker-picker UI
      description: >
        Candidates for assignments[].workerId — not every member of the site, only
        those with role WORKER, and only ACTIVE ones (an offboarded worker cannot be
        newly assigned, though existing assignments referencing them are untouched).
      responses:
        "200":
          description: The site's assignable workers, alphabetical by display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteWorker"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request body failed validation (e.g. endsAt before startsAt).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, malformed or expired bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Caller is authenticated but not a member of {siteId}.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # Mirrors ErrorResponse.java exactly — every endpoint in this API, including these
    # ones, returns errors in this one shape.
    ErrorResponse:
      type: object
      required: [error, message, requestId]
      properties:
        error:
          type: string
          example: Forbidden
        message:
          type: string
          example: Access denied
        requestId:
          type: string
          nullable: true

    ShiftStatus:
      type: string
      enum: [PLANNED, ACTIVE, CLOSED, CANCELLED]
      description: >
        Server-controlled. A client cannot set this directly at creation — every shift
        is created as PLANNED. A client can trigger two transitions, both from PLANNED
        or ACTIVE only and both terminal: cancel (POST .../shifts/{shiftId}/cancel) for
        a shift called off before or during its run, and close (POST
        .../shifts/{shiftId}/close) for one that ran to completion — close additionally
        requires endsAt to have passed. Neither has an undo.

    Intensity:
      type: string
      enum: [LIGHT, MODERATE, HEAVY]
      description: >
        Fixed set only — never free text. Drives the heat-rest policy engine
        downstream, so an unrecognised value must be rejected, not guessed at.

    ShiftAssignment:
      type: object
      required: [id, workerId, intensity]
      properties:
        id:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        taskName:
          type: string
          nullable: true
          maxLength: 120
        intensity:
          $ref: "#/components/schemas/Intensity"
        acclimatisationDay:
          type: integer
          minimum: 1
          maximum: 7
          nullable: true
          description: Which of the 7 required ramp-up days this worker is on. Omitted for a fully acclimatised worker.

    ShiftAssignmentCreate:
      type: object
      required: [workerId, intensity]
      properties:
        workerId:
          type: string
          format: uuid
        taskName:
          type: string
          maxLength: 120
        intensity:
          $ref: "#/components/schemas/Intensity"
        acclimatisationDay:
          type: integer
          minimum: 1
          maximum: 7

    Shift:
      type: object
      required: [id, siteId, startsAt, endsAt, status, assignments]
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ShiftStatus"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/ShiftAssignment"

    ShiftCreateRequest:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        assignments:
          type: array
          default: []
          description: Optional. A shift may be created empty and staffed later via the assignments endpoint.
          items:
            $ref: "#/components/schemas/ShiftAssignmentCreate"

    ShiftUpdateRequest:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time

    ShiftAssignmentUpdateRequest:
      type: object
      required: [intensity]
      description: >
        Same fields as ShiftAssignmentCreate minus workerId, which this request
        deliberately cannot change.
      properties:
        taskName:
          type: string
          maxLength: 120
        intensity:
          $ref: "#/components/schemas/Intensity"
        acclimatisationDay:
          type: integer
          minimum: 1
          maximum: 7

    SiteWorker:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string

    CancelShiftRequest:
      type: object
      required: [reason]
      description: >
          Explains why the shift was cancelled. The recorded reason is reflected in the audit trail only — never stored on the shift
          or returned in any shift payload, because a site's shifts are readable by any site member
          (workers included) and the reason may be sensitive.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500