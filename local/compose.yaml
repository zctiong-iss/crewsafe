# Local development stack for CrewSafe.
#
# Start it through the launcher:
#   ./run.sh --account <alias>         # Podman
#   ./run-docker.sh --account <alias>  # Docker
#
# The launcher resolves the shared Cognito values from the GitHub repository variable
# and exports the APP_COGNITO_* / VITE_* environment needed by the app containers.
# No local Cognito emulator belongs in this stack; normal development uses the shared
# deployed pool described in docs/adr/0006-shared-remote-cognito-for-development.md.

name: crewsafe-local

services:
  postgres:
    image: postgres:16
    container_name: crewsafe-postgres
    environment:
      POSTGRES_DB: crewsafe
      POSTGRES_USER: crewsafe
      POSTGRES_PASSWORD: crewsafe_local_dev
    ports:
      - "5434:5432"
    volumes:
      - crewsafe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewsafe -d crewsafe"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5.5.0
    container_name: crewsafe-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    # Digest-pinned: the floating `-21` tag lets the bundled JDK change on any pull, with no
    # diff to review. This is the multi-arch index (amd64, arm64/v8, ppc64le, riscv64, s390x),
    # so every architecture resolves to the same build; it currently carries Temurin
    # jdk-21.0.11+10. Re-pin deliberately when moving to a newer JDK.
    image: maven:3.9.16-eclipse-temurin-21@sha256:2b4496088e7b80ae10a8c9f74e574ea21380325a006ec684532ad6bad5bc7273
    container_name: crewsafe-backend
    working_dir: /workspace/backend
    command: ./mvnw -q -B spring-boot:run
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/crewsafe
      DB_USERNAME: crewsafe
      DB_PASSWORD: crewsafe_local_dev
      SPRING_PROFILES_ACTIVE: local
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_COGNITO_ISSUER_URI: ${APP_COGNITO_ISSUER_URI:?APP_COGNITO_ISSUER_URI is required}
      APP_COGNITO_JWK_SET_URI: ${APP_COGNITO_JWK_SET_URI:?APP_COGNITO_JWK_SET_URI is required}
      APP_COGNITO_CLIENT_IDS: ${APP_COGNITO_CLIENT_IDS:?APP_COGNITO_CLIENT_IDS is required}
      APP_COGNITO_DEMO_USERS_JSON: ${APP_COGNITO_DEMO_USERS_JSON:?APP_COGNITO_DEMO_USERS_JSON is required}
      # Weather collection is intentionally opt-in. Forwarding these switches lets a
      # developer choose live collection or deterministic fixture replay without editing
      # application.yml or the Compose file.
      WEATHER_DATA_MODE: ${WEATHER_DATA_MODE:-live}
      WEATHER_INGESTION_ENABLED: ${WEATHER_INGESTION_ENABLED:-true}
      WEATHER_FIXTURE_LOOP: ${WEATHER_FIXTURE_LOOP:-true}
      NEA_API_KEY: ${NEA_API_KEY:-}
      # Lightning shares WEATHER_DATA_MODE above (one switch for "does this instance call
      # real government APIs at all") but has its own enabled flag and loop setting, since a
      # developer may want one feed running without the other.
      LIGHTNING_INGESTION_ENABLED: ${LIGHTNING_INGESTION_ENABLED:-true}
      LIGHTNING_FIXTURE_LOOP: ${LIGHTNING_FIXTURE_LOOP:-false}
      # Where the agent (SCRUM-289) reaches ml-service. NOT localhost: the backend runs in this
      # container, so localhost:8000 is the container itself and the call fails instantly.
      #
      # Getting this wrong is quiet rather than loud, which is why it is pinned here instead of
      # left to the application default. An unreachable ml-service is a state the agent is built
      # to survive: it falls back to the deterministic plan and still returns 201. So a demo run
      # against the wrong host produces a real, correct, complete plan that the language model
      # never touched — and nothing on screen says so. Check `modelVersion` on the response
      # (`deterministic-fallback` means the model was not reached) rather than trusting that a
      # plan appearing means the agent ran.
      #
      # ml-service is not in this Compose file: it needs AWS credentials for Bedrock, which do
      # not belong in a checked-in local stack. Run it on the host and let the container reach
      # back out via host.docker.internal (works on Docker Desktop and on Podman 4+).
      BEDROCK_API_URL: ${BEDROCK_API_URL:-http://host.docker.internal:8000}
      # Same trap, same fix, second endpoint: SCRUM-281's trained-model forecast (called via
      # SiteForecastService -> ForecastApiClient -> ml-service's /forecast) defaults to
      # localhost:8000 in application.yml, which inside this container is the backend itself.
      # It is not silent in the same way BEDROCK_API_URL is - a wrong host here just means
      # every draft's forecast quietly degrades to the persistence baseline (ForecastUnavailableException
      # is caught and logged, never thrown to the caller) - but the demo should show a real
      # forecast, not the baseline pretending to be one.
      FORECAST_BASE_URL: ${FORECAST_BASE_URL:-http://host.docker.internal:8000}
    extra_hosts:
      # Linux Docker has no built-in host.docker.internal; this makes the same URL work there.
      - "host.docker.internal:host-gateway"
    volumes:
      - ../:/workspace
      - crewsafe-m2-cache:/root/.m2
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-bookworm
    container_name: crewsafe-web
    working_dir: /workspace/web
    command: sh -lc 'npm install --no-package-lock && npm run dev -- --host 0.0.0.0'
    environment:
      VITE_COGNITO_AUTHORITY: ${VITE_COGNITO_AUTHORITY:?VITE_COGNITO_AUTHORITY is required}
      VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID:?VITE_COGNITO_CLIENT_ID is required}
      VITE_COGNITO_HOSTED_UI_DOMAIN: ${VITE_COGNITO_HOSTED_UI_DOMAIN:?VITE_COGNITO_HOSTED_UI_DOMAIN is required}
      VITE_REDIRECT_URI: http://localhost:5173/callback
      VITE_POST_LOGOUT_REDIRECT_URI: http://localhost:5173/
      VITE_API_BASE_URL: http://localhost:8080
    volumes:
      - ../:/workspace
      - crewsafe-web-node-modules:/workspace/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  crewsafe-pgdata:
  crewsafe-m2-cache:
  crewsafe-web-node-modules:
